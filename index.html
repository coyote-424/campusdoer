<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Doer</title>
<style>
:root{
  --bg:#0F070A; --surface:#161019; --surface2:#1D1522; --line:rgba(225,29,30,.15); --line2:rgba(225,29,30,.3);
  --ink:#F3F4F6; --muted:#9E9EB2; --accent:#E11D1E; --accent2:#FF4B4D;
  --cyan:#1077C6; --ok:#28965A; --warn:#F3BD48; --bad:#FF4B4D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#F8FAFC;--surface:#FFFFFFcc;--surface2:#FFFFFF;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0F172A;--muted:#64748B;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:
  radial-gradient(1100px 500px at 10% -10%, #E11D1E22, transparent 60%),
  radial-gradient(900px 500px at 100% 0%, #28965A15, transparent 60%),
  var(--bg);
  color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  letter-spacing:-.01em; min-height:100%;
}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--surface);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7A0F10);
  display:flex;align-items:center;justify-content:center;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:700}
.brand p{margin:0;font-size:11px;color:var(--muted)}
.livepill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#4FA8E8;
  background:#1077C622;border:1px solid #1077C666;padding:5px 10px;border-radius:20px}
.livepill.off{color:var(--bad);background:#FF4B4D18;border-color:#FF4B4D40}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 18px;background:var(--surface2);
  border-bottom:1px solid var(--line); scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;background:transparent;color:var(--muted);
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--accent);color:#fff}
main{max-width:880px;margin:0 auto;padding:20px 18px 60px}
.card{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--line);
  border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px -12px #00000066}
.card h2{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3{margin:16px 0 8px;font-size:11.5px;color:var(--muted);text-transform:none;font-weight:600}
label{display:block;font-size:11.5px;color:var(--muted);margin:9px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:9px;
  background:var(--surface2);color:var(--ink);font-size:13px;font-family:inherit;outline:none;
  transition:box-shadow .15s,border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #E11D1E33}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
button.primary{background:linear-gradient(135deg,var(--accent),#FF4B4D);color:#fff;border:none;
  padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;
  box-shadow:0 4px 14px -4px #E11D1E77;transition:transform .1s}
button.primary:hover{transform:translateY(-1px)}
button.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);padding:6px 12px;
  border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
button.ghost:hover{border-color:var(--accent)}
button.danger{background:#FF4B4D22;border:1px solid #FF4B4D55;color:#FCA5A5;padding:7px 13px;
  border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item:first-child{border-top:none}
.meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;
  border-radius:20px;background:var(--line);color:var(--muted)}
.pill.ok{background:#28965A22;color:var(--ok)}
.pill.warn{background:#F3BD4822;color:var(--warn)}
.pill.bad{background:#FF4B4D22;color:var(--bad)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.metric{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--surface2)}
.metric b{display:block;font-size:22px;font-weight:800}
.metric span{font-size:11px;color:var(--muted)}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.qr{width:88px;height:88px;border-radius:8px;flex:none;
  background:
   repeating-linear-gradient(0deg, var(--ink) 0 4px, transparent 4px 8px),
   repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 8px);
  background-blend-mode:multiply; opacity:.85; border:1px solid var(--line2)}
.term{background:#080B12;color:#6EE7B7;font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:11px;
  padding:14px;font-size:12.5px;min-height:140px;white-space:pre-wrap;border:1px solid var(--line2)}
.termline{opacity:.92;margin-bottom:5px;line-height:1.5}
small.hint{color:var(--muted);display:block;margin-top:6px}
.alertcard{border-color:#F3BD4855;background:linear-gradient(135deg,#F3BD4814,var(--surface))}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 10px 30px -10px #000a}
.toast.show{opacity:1}
.rateBtns button{padding:5px 10px;font-size:11px;margin-right:5px}
.query{background:#E11D1E14;border-left:3px solid var(--accent);padding:9px 12px;border-radius:8px;font-size:13px;margin-top:8px;line-height:1.5}
.sos{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
.sos.armed{animation:fl .5s infinite alternate}
.sosCard{border-color:var(--accent);background:#E11D1E22;animation:fl 1s infinite alternate}
@keyframes fl{from{box-shadow:0 0 0 0 #E11D1E00}to{box-shadow:0 0 18px 2px #E11D1E88}}
.pill.cy{background:#1077C633;color:#4FA8E8}
.themebtn{border:1px solid var(--line2);background:transparent;color:var(--muted);width:30px;height:30px;
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
    <div><h1>Campus Doer</h1><p>Frictionless University Operations Engine &amp; Off-Grid Gateway</p></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="livepill" id="livePill"><span class="dot"></span> Live Gateway Active</span>
    <button class="sos" id="sosBtn" onclick="sosClick()">🚨 Medical SOS</button>
    <button class="themebtn" onclick="toggleTheme()" title="Toggle theme">◐</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const state = {
  role:'student', offline:false,
  tickets:[
    {id:'T-101',cat:'Plumbing',studentName:'Rohan Das',hostel:'Hostel B',room:'214',desc:'Washroom tap loose and leaking continuously since yesterday',urgency:'High',status:'In Progress',assignedStaff:'Ramesh (Plumber)',age:20},
    {id:'T-102',cat:'Plumbing',studentName:'Aarav Sharma',hostel:'Hostel B',room:'208',desc:'Very low water pressure in Wing 2 washroom',urgency:'Medium',status:'In Progress',assignedStaff:'Ramesh (Plumber)',age:30},
    {id:'T-103',cat:'Electrical',studentName:'Priya Mohanty',hostel:'Hostel C',room:'118',desc:'Ceiling fan making vibrating grinding noise at speed 3',urgency:'High',status:'Logged',assignedStaff:'Kailash (Electrician)',age:52},
    {id:'T-104',cat:'Mess',studentName:'Aarav Sharma',hostel:'Hostel B',room:'208',desc:'Mess dinner cold, shortage of dal',urgency:'Low',status:'Logged',assignedStaff:'Das (Mess Manager)',age:6},
  ],
  passes:[{id:'GP-201',dest:'Cuttack (Home)',dep:'2026-10-02',ret:'2026-10-04',reason:'Family function',status:'Pending',otp:null,qr:false,studentName:'Priya Mohanty',room:'118',student:'Priya Mohanty · Rm 118'}],
  passSeq:202,
  student:{name:'Rohan Das',roll:'230110145',hostel:'Hostel B',room:'214'},
  subjects:[{n:'Data Structures',att:21,tot:26},{n:'DBMS',att:17,tot:24},{n:'Mathematics',att:17,tot:25},{n:'Operating Systems',att:17,tot:25}],
  feed:[{cat:'Academic',text:'Mid-sem lab schedule released. Check your timetable.'},{cat:'Hostel',text:'Water tanker maintenance tomorrow 6-8 AM (Hostel B).'},{cat:'Emergency',text:'Fire drill Friday 4 PM. Assemble at the main gate.'}],
  timetable:[{t:'10:00',s:'Data Structures',h:'LH-3',st:'Upcoming'},{t:'11:00',s:'DBMS',h:'LH-1',st:'Upcoming'},{t:'1:00',s:'Mathematics',h:'LH-2',st:'Upcoming'},{t:'3:00',s:'OS Lab',h:'Lab-2',st:'Upcoming'}],
  sos:null,
  acad:{cgpa:'8.64',sgpa:'8.40',subs:[{n:'Data Structures',cr:4,g:'E',lab:'27/30'},{n:'DBMS',cr:4,g:'A',lab:'25/30'},{n:'Mathematics',cr:3,g:'O'},{n:'Operating Systems',cr:4,g:'A',lab:'24/30'}]},
  roster:[{name:'Aarav Sharma',hostel:'Hostel B',room:'208'},{name:'Sourav Behera',hostel:'Hostel B',room:'210'},{name:'Rohan Das',hostel:'Hostel B',room:'214'},{name:'Debashish Nayak',hostel:'Hostel B',room:'216'},{name:'Priya Mohanty',hostel:'Hostel C',room:'118'}],
  bookings:[{id:'B-1',res:'Seminar Hall',date:'2026-10-05',slot:'2 PM - 5 PM',why:'Robotics Club workshop',by:'Aarav Sharma',status:'Pending'}],
  meals:[{n:'Breakfast',t:'7:30-9:00 AM',menu:'Poha, Tea'},{n:'Lunch',t:'12:30-2:00 PM',menu:'Rice, Dal, Aloo Gobi, Curd'},{n:'Snacks',t:'5:00-5:45 PM',menu:'Samosa, Chai'},{n:'Dinner',t:'8:00-9:30 PM',menu:'Roti, Paneer Curry, Salad'}],
  rate:{Breakfast:{Good:9,OK:3,Poor:1},Lunch:{Good:14,OK:5,Poor:2},Snacks:{Good:11,OK:4,Poor:0},Dinner:{Good:8,OK:6,Poor:3}},
  isAdminLoggedIn:false, adminPin:'1234',
};

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function ageTag(a){return a>48?'bad':a>24?'warn':'ok';}
function statusTag(s){return ['Resolved','Approved','Checked Out'].includes(s)?'ok':(s==='Rejected'?'bad':'warn');}
function setRole(r){state.role=r; render();}
function loginAdmin(enteredPin){
  const err=document.getElementById('pinError');
  if(enteredPin===state.adminPin){
    state.isAdminLoggedIn=true; toast('Warden authenticated'); render();
  } else if(err){
    err.textContent='Incorrect PIN — access denied.'; err.style.display='block';
  }
}
function logoutAdmin(){state.isAdminLoggedIn=false; toast('Logged out of Warden Command'); render();}
function toggleTheme(){
  const html=document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme')==='light'?'dark':'light');
}
function toggleOffline(){
  state.offline=!state.offline;
  const p=document.getElementById('livePill');
  p.className='livepill'+(state.offline?' off':'');
  p.innerHTML=`<span class="dot"></span> ${state.offline?'Offline Mesh Mode':'Live Gateway Active'}`;
  toast(state.offline?'Switched to offline / 2G simulation — actions will queue':'Back online — queued actions synced');
}

function submitPass(dest,dep,ret,reason){
  const id='GP-'+(state.passSeq++);
  const s=state.student;
  state.passes.unshift({id,dest,dep,ret,reason,status:'Pending',otp:null,qr:false,studentName:s.name,room:s.room,student:s.name+' · Rm '+s.room});
  toast((state.offline?'Queued offline — ':'')+'Gate pass '+id+' submitted for approval');
  render();
}
const STAFF={Plumbing:'Ramesh (Plumber)',Electrical:'Kailash (Electrician)','Hostel Disturbance / Noise':'Warden on duty','Ragging / Harassment':'Anti-Ragging Cell',Sanitation:'Housekeeping Supervisor',Mess:'Das (Mess Manager)'};
const STAFF_LIST=Object.values(STAFF);
function myPasses(){return state.passes.filter(p=>p.studentName===state.student.name);}
function attStats(){
  const a=state.subjects.reduce((s,x)=>s+x.att,0), t=state.subjects.reduce((s,x)=>s+x.tot,0);
  return {a,t,pct:Math.round(a/t*100),ok:a/t>=0.75,need:Math.max(0,Math.ceil((0.75*t-a)/0.25))};
}
function submitTicket(){
  const s=state.student, cat=document.getElementById('mCat').value, urg=document.getElementById('mUrg').value;
  const desc=document.getElementById('mDesc').value.trim();
  if(!desc){toast('Add a short description of the issue');return;}
  const id='T-'+(101+state.tickets.length);
  state.tickets.unshift({id,cat,studentName:s.name,hostel:s.hostel,room:s.room,desc,urgency:urg,status:'Logged',assignedStaff:STAFF[cat],age:0,anon:document.getElementById('mAnon').checked});
  toast(id+' logged and auto-routed to '+STAFF[cat]); render();
}
function setTicketStatus(id,st){state.tickets.find(t=>t.id===id).status=st;toast(id+' marked '+st);render();}
function reassignTicket(id){
  const t=state.tickets.find(t=>t.id===id);
  t.assignedStaff=STAFF_LIST[(STAFF_LIST.indexOf(t.assignedStaff)+1)%STAFF_LIST.length];
  toast(id+' reassigned to '+t.assignedStaff);render();
}
function approvePass(id){const p=state.passes.find(p=>p.id===id);p.status='Approved';p.otp=String(Math.floor(1000+Math.random()*9000));p.qr=true;toast(id+' approved — OTP generated');render();}
function rejectPass(id){const p=state.passes.find(p=>p.id===id);p.status='Rejected';toast(id+' rejected');render();}
function rateMeal(m,k){state.rate[m][k]++;toast('Thanks for rating '+m+': '+k);render();}
function who(t){return t.anon?'Anonymous Resident · Wing '+t.room[0]:t.studentName+' · '+t.hostel+', Rm '+t.room;}
let sosArmed=false;
function sosClick(){
  const b=document.getElementById('sosBtn');
  if(!sosArmed){sosArmed=true;b.textContent='Tap again to confirm';b.classList.add('armed');
    setTimeout(()=>{sosArmed=false;b.textContent='🚨 Medical SOS';b.classList.remove('armed');},4000);return;}
  sosArmed=false;b.textContent='🚨 Medical SOS';b.classList.remove('armed');
  const s=state.student;state.sos={by:s.name,hostel:s.hostel,room:s.room,time:new Date().toLocaleTimeString()};
  toast('Emergency beacon sent to Warden and Gate');render();
}
function sosCard(){
  const x=state.sos; if(!x) return '';
  const can=(state.role==='admin'&&state.isAdminLoggedIn)||state.role==='guard';
  return `<div class="card sosCard"><b>🚨 EMERGENCY: Medical SOS triggered by ${x.by} (${x.hostel}, Rm ${x.room}) at ${x.time} — Gate cleared for ambulance.</b>${can?'<div><button class="ghost" style="margin-top:8px" onclick="state.sos=null;render()">Clear alert</button></div>':''}</div>`;
}
function feedCard(){return `<div class="card"><h2>Official Broadcasts</h2>${state.feed.map(n=>`<div class="item"><div><span class="pill ${n.cat==='Emergency'?'bad':n.cat==='Hostel'?'warn':'cy'}">${n.cat}</span><p style="margin:6px 0 0;font-size:13px">${n.text}</p></div></div>`).join('')}</div>`;}
function attSim(s){
  const n=state.timetable.filter(x=>x.st==='Upcoming').length, cur=s.a/s.t*100, yes=(s.a+n)/(s.t+n)*100, no=s.a/(s.t+n)*100;
  return `<div class="meta">If you attend today's ${n} classes: <b style="color:var(--ok)">${yes.toFixed(1)}% (+${(yes-cur).toFixed(1)}%)</b><br>If you miss them: <b style="color:var(--bad)">${no.toFixed(1)}% (${(no-cur).toFixed(1)}%)</b>${s.ok?'':`<br>Consecutive classes needed to hit 75%: <b>${s.need}</b>`}</div>`;
}
function submitBooking(){
  const g=id=>document.getElementById(id).value;
  if(!g('bWhy').trim()){toast('Add the club / purpose');return;}
  state.bookings.unshift({id:'B-'+(state.bookings.length+1),res:g('bRes'),date:g('bDate')||'—',slot:g('bSlot'),why:g('bWhy'),by:state.student.name,status:'Pending'});
  toast('Booking request sent to Warden');render();
}
function setBooking(id,st){state.bookings.find(b=>b.id===id).status=st;toast(id+' '+st);render();}
function rollCard(){
  const out=state.passes.filter(p=>p.status==='Checked Out'), n=out.length, T=250, isOut=nm=>out.some(p=>p.studentName===nm);
  return `<div class="card"><h2>Hostel Night Roll-Call &amp; Mess Headcount</h2>
   <div class="grid4"><div class="metric"><b>${T}</b><span>Total residents</span></div><div class="metric"><b style="color:var(--ok)">${T-n}</b><span>Checked in</span></div><div class="metric"><b style="color:var(--warn)">${n}</b><span>Out on gate pass</span></div><div class="metric"><b>${T-n}</b><span>Meals to prepare</span></div></div>
   <p class="meta">Projected diners today = ${T} hostellers − ${n} checked-out passes = <b style="color:var(--ink)">${T-n}</b> meals.</p>
   <h3>Room allotments</h3>${state.roster.map(r=>`<div class="item"><div><b>${r.name}</b><div class="meta">${r.hostel} · Rm ${r.room}</div></div><span class="pill ${isOut(r.name)?'warn':'ok'}">${isOut(r.name)?'Out (gate pass)':'In hostel'}</span></div>`).join('')}</div>`;
}
function importCsv(){toast('Simulated: 214 student records migrated from legacy ERP');}

function verifyOtp(code){
  const p=state.passes.find(p=>p.otp===code && p.status==='Approved');
  const out=document.getElementById('guardResult');
  if(p){
    p.status='Checked Out';
    out.innerHTML=`<div class="card" style="margin-top:10px;border-color:#28965A55">
      <span class="pill ok">● Authorized Departure</span>
      <p style="margin:10px 0 2px;font-size:14px;font-weight:700">${p.student}</p>
      <p class="meta">Destination: ${p.dest} · Return: ${p.ret}<br>Checkout: ${new Date().toLocaleTimeString()} · ${p.id}</p></div>`;
    toast('Gate log recorded for '+p.id); render();
  } else {
    out.innerHTML=`<div class="card" style="margin-top:10px;border-color:#FF4B4D55">
      <span class="pill bad">● Invalid / Unapproved</span>
      <p class="meta" style="margin-top:8px">No approved pass matches that code.</p></div>`;
  }
}
function runSms(){
  const inp=document.getElementById('smsIn'); const cmd=inp.value.trim(); if(!cmd) return;
  const log=document.getElementById('smsLog');
  const line=(t)=>{const d=document.createElement('div');d.className='termline';d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;};
  line('> '+cmd); inp.value='';
  const parts=cmd.split(/\s+/);
  if(parts[0]==='GATE' && parts[1]==='LEAVE' && parts.length>=5){
    const [,,dep,ret,...destArr]=parts, dest=destArr.join(' ');
    submitPass(dest,dep,ret,'SMS fallback request');
    line('SMS CONFIRM: Gate pass GP-'+(state.passSeq-1)+' queued for warden approval. Reply STATUS '+(state.passSeq-1)+' to check.');
  } else if(parts[0]==='STATUS' && parts[1]){
    const p=state.passes.find(x=>x.id.includes(parts[1]))||state.passes[0];
    line(p?`SMS: ${p.id} is ${p.status}${p.otp?(' · OTP '+p.otp):''}`:'SMS: No matching request found.');
  } else {
    line('SYNTAX ERROR. Try: GATE LEAVE 2026-10-02 2026-10-04 HOME');
  }
}
function ring(pct,color){
  const r=36,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ring"><svg width="86" height="86"><circle cx="43" cy="43" r="${r}" stroke="var(--line2)" stroke-width="8" fill="none"/>
    <circle cx="43" cy="43" r="${r}" stroke="${color}" stroke-width="8" fill="none" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="val">${pct}%</div></div>`;
}

function studentView(){
  return `
  <div class="card" style="padding:12px 18px"><span class="meta" style="margin:0">Logged in as: <b style="color:var(--ink)">${state.student.name}</b> · Roll: ${state.student.roll} · ${state.student.hostel}, Rm ${state.student.room}</span></div>
  ${(()=>{const s=attStats();return `<div class="card" style="border-color:${s.ok?'#28965A55':'#FF4B4D55'}">
    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
      ${ring(s.pct,s.ok?'var(--ok)':'var(--bad)')}
      <div style="flex:1;min-width:220px">
        <h2 style="margin:0 0 4px">Academic Attendance Pulse</h2>
        <div style="font-size:13px">Classes Attended: <b>${s.a} / ${s.t}</b></div>
        <div style="margin-top:8px">${s.ok?'<span class="pill ok">✓ Eligible for Semester Examinations</span>':`<span class="pill bad" style="white-space:normal;line-height:1.4">⚠️ Attendance Alert: ${s.pct}% (Below BPUT 75% Mandatory Cutoff — Risk of Examination Debarment)</span>`}</div>
        ${attSim(s)}
      </div>
    </div>
    <h3>Subject breakdown</h3>
    <div class="grid4">${state.subjects.map(x=>{const p=Math.round(x.att/x.tot*100);return `<div class="metric"><span>${x.n}</span><b style="font-size:16px;color:${p<75?'var(--bad)':'var(--ink)'}">${x.att} / ${x.tot} · ${p}%</b>${p<75?'<br><span class="pill bad" style="margin-top:6px">Below BPUT 75%</span>':''}</div>`;}).join('')}</div>
  </div>`;})()}
  <div class="card"><h2>Academic Progress &amp; CGPA</h2>
    <div class="grid4"><div class="metric"><b>${state.acad.cgpa}</b><span>Overall CGPA</span></div><div class="metric"><b>${state.acad.sgpa}</b><span>Current SGPA</span></div></div>
    <h3>This semester</h3>${state.acad.subs.map(x=>`<div class="item"><div><b>${x.n}</b><div class="meta">${x.cr} credits${x.lab?' · Lab internal '+x.lab:''}</div></div><span class="pill ${x.g==='O'||x.g==='E'?'ok':'warn'}">Grade ${x.g}</span></div>`).join('')}
  </div>
  <div class="card"><h2>Today's Timetable</h2>
    ${state.timetable.map(x=>`<div class="item"><div><b>${x.t}</b> — ${x.s}<div class="meta">${x.h}</div></div><span class="pill ${x.st==='Attended'?'ok':'warn'}">${x.st}</span></div>`).join('')}
  </div>
  <div class="card">
    <h2>Log a Maintenance Issue</h2>
    <div class="row">
      <div><label>Category</label><select id="mCat"><option>Plumbing</option><option>Electrical</option><option>Hostel Disturbance / Noise</option><option>Ragging / Harassment</option><option>Sanitation</option><option>Mess</option></select></div>
      <div><label>Urgency</label><select id="mUrg"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
    </div>
    <label>Description</label><textarea id="mDesc" rows="2" placeholder="e.g. Leaking tap in washroom"></textarea>
    <label>Attachment</label><input type="file" disabled style="opacity:.5"> <small class="hint">Photo/voice preview (simulated)</small>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="mAnon" style="width:auto">Submit as Anonymous Report (hides name &amp; room from public records)</label>
    <button class="primary" onclick="submitTicket()">Submit Complaint</button>
    <h3>Your Tickets</h3>
    ${state.tickets.filter(t=>t.studentName===state.student.name).map(t=>`<div class="item"><div><b>${t.id} · ${t.cat}</b> <span class="pill ${t.urgency==='High'?'bad':t.urgency==='Medium'?'warn':''}">${t.urgency}</span><div class="meta">${t.desc}</div><div class="meta">Assigned to ${t.assignedStaff}</div></div><span class="pill ${statusTag(t.status)}">${t.status}</span></div>`).join('')||'<p class="meta">No tickets yet.</p>'}
  </div>
  <div class="card">
    <h2>Gate Pass / Leave</h2>
    <div class="row"><div><label>Destination</label><input id="pDest" placeholder="HOME"></div><div><label>Reason</label><input id="pReason" placeholder="Weekend visit"></div></div>
    <div class="row"><div><label>Departure</label><input id="pDep" type="date"></div><div><label>Return</label><input id="pRet" type="date"></div></div>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" checked style="width:auto">Notify parent by SMS</label>
    <button class="primary" onclick="submitPass(document.getElementById('pDest').value||'HOME',document.getElementById('pDep').value||'—',document.getElementById('pRet').value||'—',document.getElementById('pReason').value||'—')">Request Gate Pass</button>
    <h3>Pass Ledger</h3>
    ${myPasses().length?myPasses().map(p=>`
      <div class="item"><div><b>${p.id}</b> → ${p.dest}<div class="meta">${p.dep} to ${p.ret}</div>${p.otp?`<div class="meta">Emergency OTP: <b style="color:var(--ink)">${p.otp}</b></div>`:''}</div>
      <div style="text-align:right">${p.qr?'<div class="qr" style="margin-left:auto"></div>':''}<span class="pill ${statusTag(p.status)}">${p.status}</span></div></div>`).join(''):'<p class="meta">No requests yet.</p>'}
  </div>
  ${feedCard()}
  <div class="card"><h2>Seminar Hall &amp; Resource Booking</h2>
    <div class="row"><div><label>Resource</label><select id="bRes"><option>Seminar Hall</option><option>Projector Room</option></select></div>
    <div><label>Date</label><input id="bDate" type="date"></div>
    <div><label>Slot</label><select id="bSlot"><option>9 AM - 12 PM</option><option>2 PM - 5 PM</option><option>5 PM - 8 PM</option></select></div></div>
    <label>Club / Purpose</label><input id="bWhy" placeholder="e.g. Robotics Club workshop">
    <button class="primary" onclick="submitBooking()">Request Booking</button>
    <h3>Your bookings</h3>${state.bookings.filter(b=>b.by===state.student.name).map(b=>`<div class="item"><div><b>${b.res}</b><div class="meta">${b.date} · ${b.slot} · ${b.why}</div></div><span class="pill ${statusTag(b.status)}">${b.status}</span></div>`).join('')||'<p class="meta">No bookings yet.</p>'}
  </div>
  <div class="card"><h2>Canteen Routine</h2>
    ${state.meals.map(m=>`<div class="item"><div><b>${m.n}</b> · ${m.t}<div class="meta">${m.menu}</div></div><div class="rateBtns">${['Good','OK','Poor'].map(k=>`<button class="ghost" onclick="rateMeal('${m.n}','${k}')">${k} ${state.rate[m.n][k]}</button>`).join('')}</div></div>`).join('')}
  </div>`;
}

function adminLockView(){
  return `
  <div class="card" style="max-width:360px;margin:40px auto;text-align:center">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);
      display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="var(--accent)" stroke-width="1.8"/>
      <path d="M8 11V8a4 4 0 018 0v3" stroke="var(--accent)" stroke-width="1.8"/></svg>
    </div>
    <h2 style="justify-content:center">Warden Command — Secure Access</h2>
    <p class="meta" style="margin-bottom:4px">Enter your PIN to access institution-wide controls.</p>
    <label>PIN</label>
    <input id="adminPinIn" type="password" inputmode="numeric" maxlength="6" placeholder="••••"
      onkeydown="if(event.key==='Enter')loginAdmin(document.getElementById('adminPinIn').value)" style="text-align:center;letter-spacing:.3em">
    <p id="pinError" class="meta" style="display:none;color:var(--bad);margin-top:8px"></p>
    <button class="primary" style="width:100%" onclick="loginAdmin(document.getElementById('adminPinIn').value)">Unlock Command Center</button>
    <small class="hint">Demo PIN: 1234</small>
  </div>`;
}
function adminView(){
  if(!state.isAdminLoggedIn) return adminLockView();
  const pendingPass=state.passes.filter(p=>p.status==='Pending').length, openTix=state.tickets.filter(t=>t.status!=='Resolved').length;
  return `
  <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
    <span class="pill ok">● Warden Authenticated</span>
    <button class="ghost" onclick="logoutAdmin()">Log Out</button>
  </div>
  <div class="card"><h2>Command Summary</h2>
    <div class="grid4">
      <div class="metric"><b>${pendingPass}</b><span>Pending Passes</span></div>
      <div class="metric"><b>${openTix}</b><span>Open Tickets</span></div>
      <div class="metric"><b>18h</b><span>Avg Resolution</span></div>
      <div class="metric"><b style="color:var(--bad)">${state.tickets.filter(t=>t.age>48).length}</b><span>&gt;48h Aged</span></div>
    </div></div>
  <div class="card alertcard"><h2 style="color:var(--warn)">⚠ Pattern Cluster Alert</h2>
    <p style="font-size:13px;margin:0">6 plumbing complaints in Hostel B Wing 2 within 48h — possible main pipeline failure.</p>
    <button class="ghost" style="margin-top:10px">Escalate to Facilities</button></div>
  <div class="card"><h2>Gate Pass Approval Queue</h2>
    ${state.passes.filter(p=>p.status==='Pending').length?state.passes.filter(p=>p.status==='Pending').map(p=>`
      <div class="item"><div><b>Pass #${p.id}</b> · ${p.studentName} (Rm ${p.room})<div class="meta">${p.dest} · ${p.dep} to ${p.ret}${p.reason?' · '+p.reason:''}</div></div>
      <div><button class="primary" style="margin:0 6px 0 0;padding:7px 13px" onclick="approvePass('${p.id}')">Approve</button>
      <button class="danger" onclick="rejectPass('${p.id}')">Reject</button></div></div>`).join(''):'<p class="meta">Queue clear.</p>'}
  </div>
  ${rollCard()}
  <div class="card"><h2>Resource Bookings</h2>${state.bookings.map(b=>`<div class="item"><div><b>${b.res}</b> · ${b.date} · ${b.slot}<div class="meta">${b.why} · ${b.by}</div></div>${b.status==='Pending'?`<div><button class="primary" style="margin:0 6px 0 0;padding:7px 13px" onclick="setBooking('${b.id}','Approved')">Approve</button><button class="danger" onclick="setBooking('${b.id}','Rejected')">Reject</button></div>`:`<span class="pill ${statusTag(b.status)}">${b.status}</span>`}</div>`).join('')}</div>
  ${feedCard()}
  <div class="card"><h2>Maintenance Dispatch</h2>
    ${state.tickets.map(t=>`<div class="item" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <div><b>${t.id} · ${t.cat}</b><div class="meta">Reported by: ${who(t)}</div><div class="meta">Assigned to ${t.assignedStaff}</div></div>
        <div style="text-align:right"><span class="pill ${ageTag(t.age)}">${t.age}h${t.age>48&&t.status!=='Resolved'?' · Overdue':''}</span> <span class="pill ${statusTag(t.status)}">${t.status}</span></div>
      </div>
      <div class="query">“${t.desc}”</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        ${t.status==='Logged'?`<button class="ghost" onclick="setTicketStatus('${t.id}','In Progress')">Mark In Progress</button>`:''}
        ${t.status!=='Resolved'?`<button class="ghost" onclick="setTicketStatus('${t.id}','Resolved')">Mark Resolved</button><button class="ghost" onclick="reassignTicket('${t.id}')">Reassign</button>`:''}
        ${t.age>48&&t.status!=='Resolved'?`<button class="danger" onclick="toast('${t.id} escalated to Chief Warden')">Escalate</button>`:''}
      </div></div>`).join('')}
  </div>`;
}

function guardView(){
  return `
  <div class="card"><h2>Gate Verification</h2>
    <label>4-digit OTP or scanned QR code</label>
    <div class="row"><input id="otpIn" maxlength="4" placeholder="e.g. 4821"><button class="primary" style="margin:0" onclick="verifyOtp(document.getElementById('otpIn').value)">Verify Pass</button></div>
    <div id="guardResult"></div></div>
  <div class="card"><h2>Gate Exit History</h2>
    ${state.passes.filter(p=>p.status==='Checked Out').map(p=>`<div class="item"><div><b>${p.student}</b><div class="meta">${p.id} · ${p.dest}</div></div><span class="pill ok">Checked Out</span></div>`).join('')||'<p class="meta">No checkouts recorded yet.</p>'}
  </div>`;
}

function offgridView(){
  return `
  <div class="card"><h2>Network Mode</h2>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:auto" onclick="toggleOffline()">Simulate Offline / 2G Outage</label>
    <p class="meta">Cached PWA footprint: 1.2MB. Queued actions sync automatically when connectivity returns.</p></div>
  <div class="card"><h2>SMS / USSD Console</h2>
    <div class="term" id="smsLog"><div class="termline">Feature-phone terminal ready. Try: GATE LEAVE 2026-10-02 2026-10-04 HOME</div></div>
    <div class="row" style="margin-top:10px"><input id="smsIn" placeholder="Type SMS command" onkeydown="if(event.key==='Enter')runSms()">
    <button class="primary" style="margin:0" onclick="runSms()">Send</button></div>
    <small class="hint">Also supports: STATUS &lt;pass id&gt;</small></div>
  <div class="card"><h2>Legacy ERP Migration</h2>
    <p class="meta" style="margin:0 0 10px">Bulk-import student rosters from a legacy CSV export.</p>
    <button class="ghost" onclick="importCsv()">Simulate CSV Roster Import</button></div>`;
}

function render(){
  const roles=[['student','Student Space'],['admin','Warden Command'],['guard','Gate Checkpoint'],['offgrid','Off-Grid Engine']];
  document.getElementById('nav').innerHTML=roles.map(([k,l])=>`<button class="${state.role===k?'active':''}" onclick="setRole('${k}')">${l}</button>`).join('');
  const m=document.getElementById('main');
  m.innerHTML = sosCard()+(state.role==='student'?studentView():state.role==='admin'?adminView():state.role==='guard'?guardView():offgridView());
}
render();
</script>
</body>
</html>
