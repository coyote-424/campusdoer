<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Doer · Digital Operations & Campus Services</title>
<style>
  :root{
    --bg:#0D0F14;
    --header:#12151D;
    --card:#161922;
    --card2:#1B1E28;
    --chip:#202534;
    --filter:#1B202D;
    --border:#2A2F3D;
    --filter-border:#2A3347;
    --text:#EDEDF2;
    --muted:#9BA3B2;
    --terracotta:#C2410C;
    --ochre:#D97706;
    --green:#15803D;
    --green-soft:#123322;
    --red:#B91C1C;
    --shadow:0 4px 16px rgba(0,0,0,.18);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}
  body{min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}

  .app-header{
    position:sticky;top:0;z-index:20;
    background:var(--header);
    border-bottom:1px solid var(--border);
    padding:18px 24px 14px;
  }
  .header-row{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .brand-mark{
    width:38px;height:38px;border:1px solid var(--terracotta);border-radius:10px;
    display:grid;place-items:center;color:#fff;background:rgba(194,65,12,.16);font-weight:800
  }
  h1{font-size:18px;line-height:1.2;margin:0;font-weight:750}
  .subtitle{font-size:12px;color:var(--muted);margin-top:4px}
  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .status-badge,.sos{
    border:1px solid var(--border);border-radius:999px;padding:8px 11px;font-size:12px;white-space:nowrap
  }
  .status-badge{background:var(--green-soft);border-color:#1F6B3B;color:#86EFAC}
  .sos{background:#321719;border-color:#7F1D1D;color:#FCA5A5}

  .shell{max-width:1400px;margin:0 auto;padding:16px 24px 40px}
  .nav{
    display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;
    scrollbar-width:thin;
  }
  .nav button{
    flex:0 0 auto;background:var(--filter);border:1px solid var(--filter-border);color:var(--text);
    border-radius:8px;padding:10px 13px;font-size:12.5px;font-weight:650;
  }
  .nav button:hover{border-color:var(--terracotta)}
  .nav button.active{background:var(--terracotta);border-color:var(--terracotta);color:#fff}

  main{min-height:500px}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:12px 0 18px}
  .view-head h2{font-size:24px;margin:0 0 5px}
  .view-head p{margin:0;color:var(--muted);font-size:13px}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ochre);font-weight:750;margin-bottom:6px}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .col-12{grid-column:span 12}.col-8{grid-column:span 8}.col-7{grid-column:span 7}.col-6{grid-column:span 6}.col-5{grid-column:span 5}.col-4{grid-column:span 4}
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;padding:17px;box-shadow:var(--shadow)
  }
  .card h3{font-size:15px;margin:0 0 12px}
  .card h4{font-size:13px;margin:0 0 7px}
  .muted{color:var(--muted)}
  .meta{font-size:12px;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .stack{display:grid;gap:10px}
  .divider{height:1px;background:var(--border);margin:13px 0}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .metric{background:var(--chip);border:1px solid var(--border);border-radius:9px;padding:12px}
  .metric .value{font-size:22px;font-weight:780;margin-top:4px}
  .metric .label{font-size:11px;color:var(--muted)}
  .notice{
    border:1px solid #6B4614;background:#211A0F;border-radius:9px;padding:11px 12px;color:#FCD34D;font-size:12.5px
  }
  .success{
    border:1px solid #1F6B3B;background:var(--green-soft);border-radius:9px;padding:11px 12px;color:#86EFAC;font-size:12.5px
  }
  .danger{
    border:1px solid #7F1D1D;background:#321719;border-radius:9px;padding:11px 12px;color:#FCA5A5;font-size:12.5px
  }

  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{
    width:132px;height:132px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--terracotta) 0 72%, var(--chip) 72% 100%);
    flex:0 0 auto;
  }
  .ring::after{
    content:"";width:92px;height:92px;border-radius:50%;background:var(--card);position:absolute
  }
  .ring-content{position:relative;z-index:1;text-align:center}
  .ring-content strong{display:block;font-size:26px;color:var(--text)}
  .ring-content span{font-size:11px;color:var(--muted)}

  .subject{
    display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--border)
  }
  .subject:last-child{border-bottom:0}
  .subject-title{font-size:13px;font-weight:650}
  .subject-bar{height:6px;background:var(--chip);border-radius:99px;overflow:hidden;margin-top:7px}
  .subject-fill{height:100%;background:var(--terracotta);border-radius:99px}
  .subject-pct{font-size:12px;font-weight:750}
  .warning{color:#FBBF24}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:650}
  tr:last-child td{border-bottom:0}

  .pill,.tag{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--filter);border:1px solid var(--filter-border);color:var(--text);
    border-radius:999px;padding:5px 8px;font-size:11px;font-weight:650
  }
  .tag.green{background:var(--green-soft);border-color:#1F6B3B;color:#86EFAC}
  .tag.ochre{background:#211A0F;border-color:#6B4614;color:#FCD34D}
  .tag.red{background:#321719;border-color:#7F1D1D;color:#FCA5A5}

  button.primary{
    background:var(--terracotta);border:1px solid var(--terracotta);color:#fff;
    border-radius:8px;padding:9px 12px;font-weight:700
  }
  button.primary:hover{background:#E04A0F}
  button.ghost,.utility-btn{
    background:var(--filter);border:1px solid var(--filter-border);color:var(--text);
    border-radius:8px;padding:8px 11px;font-weight:650;font-size:12px
  }
  button.ghost:hover,.utility-btn:hover{border-color:var(--terracotta);color:#fff}
  button.danger-btn{background:#321719;border:1px solid #7F1D1D;color:#FCA5A5;border-radius:8px;padding:8px 11px;font-weight:650}
  button:disabled{opacity:.55;cursor:not-allowed}

  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{
    background:var(--filter);border:1px solid var(--filter-border);color:var(--text);
    border-radius:999px;padding:7px 11px;font-size:12px
  }
  .filters button.active{border-color:var(--terracotta);color:#fff;background:#352016}
  .filters button:hover{border-color:var(--terracotta)}

  label.field{display:grid;gap:6px;font-size:12px;color:var(--muted)}
  input,select,textarea{
    width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 11px;outline:none
  }
  input:focus,select:focus,textarea:focus{border-color:var(--terracotta)}
  textarea{min-height:100px;resize:vertical}
  select option{background:var(--card2);color:var(--text)}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .full{grid-column:1/-1}

  .timeline{display:grid;gap:9px}
  .timeline-item{display:grid;grid-template-columns:145px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
  .timeline-item:last-child{border-bottom:0}
  .time{color:var(--ochre);font-size:12px;font-weight:700}

  .big-number{font-size:30px;font-weight:800}
  .progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
  .progress > span{display:block;height:100%;background:var(--terracotta)}

  .empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:9px}
  .toast{
    position:fixed;right:20px;bottom:20px;z-index:50;display:none;
    background:var(--card2);border:1px solid var(--terracotta);color:var(--text);
    border-radius:9px;padding:12px 14px;box-shadow:var(--shadow);max-width:340px;font-size:12.5px
  }
  .toast.show{display:block}

  @media(max-width:950px){
    .col-8,.col-7,.col-6,.col-5,.col-4{grid-column:span 12}
    .metrics{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:600px){
    .app-header{padding:14px}
    .shell{padding:12px 14px 30px}
    .header-row{align-items:flex-start}
    .header-actions{display:none}
    .metrics{grid-template-columns:1fr 1fr}
    .ring-wrap{align-items:flex-start;flex-direction:column}
    .form-grid{grid-template-columns:1fr}
    .timeline-item{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">CD</div>
      <div>
        <h1>Campus Doer</h1>
        <div class="subtitle">Digital Operations &amp; Campus Services</div>
      </div>
    </div>
    <div class="header-actions">
      <span class="status-badge">● Operational</span>
      <button class="sos" type="button" onclick="medicalSOS()">Medical SOS</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav id="nav" class="nav" aria-label="Campus views"></nav>
  <main id="main"></main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ----------------------------- State ----------------------------- */

const state = {
  role: "academics",
  totalHostellers: 250,
  studentsSkippingDinner: 14,
  onLeave: 12,
  studentSkippingDinner: false,

  subjects: [
    { n: "Mathematics", att: 22, tot: 26, credits: 4, grade: "Grade O" },
    { n: "Basic Electrical (BE)", att: 18, tot: 24, credits: 4, grade: "Grade E" },
    { n: "Chemistry", att: 20, tot: 25, credits: 4, grade: "Grade A" },
    { n: "Universal Human Values (UHV)", att: 19, tot: 22, credits: 3, grade: "Grade O" },
    { n: "Programming in C & DS", att: 21, tot: 26, credits: 4, grade: "Grade E" },
    { n: "Basic Civil Engineering (BCE)", att: 17, tot: 24, credits: 3, grade: "Grade A" }
  ],

  passes: [
    { id: "GP-1042", student: "Priya Mohanty", room: "B-214", purpose: "Family visit", status: "Pending" },
    { id: "GP-1038", student: "Aarav Sharma", room: "A-118", purpose: "Medical appointment", status: "Approved" }
  ],

  tickets: [
    { id: "TKT-2401", category: "Hostel Maintenance", title: "Bathroom tap leak", status: "In Progress", age: "2h" },
    { id: "TKT-2398", category: "Campus Wi-Fi", title: "Weak signal in LH-3", status: "Open", age: "5h" },
    { id: "TKT-2387", category: "Others", title: "Lost ID card assistance", status: "Resolved", age: "1d" }
  ],

  announcements: [
    { category: "Academic", title: "Mid-semester examination form window", date: "30 Sep 2026", body: "Students should complete the examination form before the published deadline." },
    { category: "Hostel", title: "Mess dinner headcount update", date: "30 Sep 2026", body: "Students skipping dinner should opt out by 6:00 PM to reduce food waste." },
    { category: "Administrative", title: "Library access timing notice", date: "29 Sep 2026", body: "Updated evening access timing is available at the library help desk." },
    { category: "Emergency", title: "Medical desk contact protocol", date: "28 Sep 2026", body: "Use Medical SOS for urgent campus medical assistance." }
  ],

  bookings: [
    { resource: "Seminar Hall", time: "Today · 4:00–6:00 PM", owner: "ECE Club", status: "Confirmed" },
    { resource: "Projector Room", time: "Tomorrow · 11:00 AM–1:00 PM", owner: "Class Representative", status: "Pending" }
  ],

  gateLog: [
    { pass: "GP-1038", student: "Aarav Sharma", action: "Checkout", time: "4:18 PM" },
    { pass: "GP-1029", student: "Rohan Das", action: "Check-in", time: "3:52 PM" }
  ],

  offlineMode: false,
  wardenUnlocked: false,
  announcementFilter: "All"
};

const NAV_ITEMS = [
  ["academics", "Academics & Attendance"],
  ["hostel", "Hostel & Living"],
  ["grievances", "Campus Grievances & Repairs"],
  ["announcements", "Announcements & Facilities"],
  ["warden", "Warden Command"],
  ["gate", "Gate Checkpoint"],
  ["offgrid", "Off-Grid Resilience"]
];

/* ----------------------------- Utilities ----------------------------- */

function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showToast(message) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(function () {
    toast.classList.remove("show");
  }, 2600);
}

function attendancePercent(subject) {
  if (!subject.tot) return 0;
  return Math.round((subject.att / subject.tot) * 100);
}

function aggregateAttendance() {
  let attended = 0;
  let total = 0;
  state.subjects.forEach(function (subject) {
    attended += subject.att;
    total += subject.tot;
  });
  return total ? Math.round((attended / total) * 100) : 0;
}

function projectedMeals() {
  return Math.max(0, state.totalHostellers - state.studentsSkippingDinner - state.onLeave);
}

function mealOptOutMessage() {
  return "Dinner forecast: " + projectedMeals() + " meals to prepare (" +
    (state.studentsSkippingDinner + state.onLeave) +
    " students opted out or are on approved leave).";
}

function setRole(role) {
  const allowed = NAV_ITEMS.some(function (item) { return item[0] === role; });
  state.role = allowed ? role : "academics";
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function medicalSOS() {
  const ok = window.confirm("Send a Medical SOS request to the campus medical desk?");
  if (ok) showToast("Medical SOS sent to the campus medical desk.");
}

function toggleSkipDinner(skipping) {
  const next = Boolean(skipping);
  if (next && !state.studentSkippingDinner) {
    state.studentsSkippingDinner += 1;
  } else if (!next && state.studentSkippingDinner) {
    state.studentsSkippingDinner = Math.max(0, state.studentsSkippingDinner - 1);
  }
  state.studentSkippingDinner = next;
  render();
  showToast(next ? "Dinner opt-out recorded." : "Dinner opt-out cancelled.");
}

function submitPass(event) {
  if (event) event.preventDefault();
  const form = document.getElementById("passForm");
  if (!form) return;
  const data = new FormData(form);
  const id = "GP-" + String(1050 + state.passes.length);
  state.passes.unshift({
    id: id,
    student: data.get("student") || "Student",
    room: data.get("room") || "—",
    purpose: data.get("purpose") || "Personal",
    status: "Pending"
  });
  form.reset();
  render();
  showToast("Outing request " + id + " submitted.");
}

function submitTicket(event) {
  if (event) event.preventDefault();
  const form = document.getElementById("ticketForm");
  if (!form) return;
  const data = new FormData(form);
  const id = "TKT-" + String(2410 + state.tickets.length);
  state.tickets.unshift({
    id: id,
    category: data.get("category") || "Others",
    title: data.get("title") || "Campus issue",
    status: "Open",
    age: "now"
  });
  form.reset();
  render();
  showToast("Ticket " + id + " submitted.");
}

function approvePass(index) {
  if (!state.passes[index]) return;
  state.passes[index].status = "Approved";
  render();
  showToast(state.passes[index].id + " approved.");
}

function rejectPass(index) {
  if (!state.passes[index]) return;
  state.passes[index].status = "Rejected";
  render();
  showToast(state.passes[index].id + " rejected.");
}

function updateTicket(index, status) {
  if (!state.tickets[index]) return;
  state.tickets[index].status = status;
  render();
  showToast(state.tickets[index].id + " marked " + status + ".");
}

function reassignTicket(index) {
  if (!state.tickets[index]) return;
  showToast(state.tickets[index].id + " reassigned to campus maintenance.");
}

function setAnnouncementFilter(filter) {
  state.announcementFilter = filter;
  render();
}

function bookResource(resource) {
  state.bookings.unshift({
    resource: resource,
    time: "Requested · pending approval",
    owner: "Current student",
    status: "Pending"
  });
  render();
  showToast(resource + " booking request submitted.");
}

function verifyOtp(event) {
  if (event) event.preventDefault();
  const input = document.getElementById("otpInput");
  const result = document.getElementById("otpResult");
  if (!input || !result) return;
  const value = input.value.trim();
  if (value === "1042") {
    result.className = "success";
    result.textContent = "Verified: GP-1042 belongs to Priya Mohanty · B-214 · Family visit.";
  } else if (value === "1038") {
    result.className = "success";
    result.textContent = "Verified: GP-1038 belongs to Aarav Sharma · A-118 · Medical appointment.";
  } else {
    result.className = "danger";
    result.textContent = "Pass not verified. Check the OTP / pass ID and try again.";
  }
}

function gateCheckout(student, pass) {
  state.gateLog.unshift({
    pass: pass,
    student: student,
    action: "Checkout",
    time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
  });
  render();
  showToast(student + " checkout logged.");
}

function toggleOfflineMode() {
  state.offlineMode = !state.offlineMode;
  render();
  showToast(state.offlineMode ? "Off-grid / 2G fallback enabled." : "Online network mode restored.");
}

function unlockWarden(event) {
  if (event) event.preventDefault();
  const input = document.getElementById("wardenPin");
  if (!input) return;
  if (input.value === "1234") {
    state.wardenUnlocked = true;
    render();
    showToast("Warden Command unlocked.");
  } else {
    showToast("Incorrect PIN.");
  }
}

function lockWarden() {
  state.wardenUnlocked = false;
  render();
}

function resolveTicket(index) {
  updateTicket(index, "Resolved");
}

function dispatchMaintenance(index) {
  if (!state.tickets[index]) return;
  state.tickets[index].status = "In Progress";
  render();
  showToast("Maintenance dispatch sent for " + state.tickets[index].id + ".");
}

/* ----------------------------- View helpers ----------------------------- */

function pageHeader(kicker, title, description) {
  return '<div class="view-head">' +
    '<div><div class="eyebrow">' + escapeHtml(kicker) + '</div>' +
    '<h2>' + escapeHtml(title) + '</h2>' +
    '<p>' + escapeHtml(description) + '</p></div>' +
    '</div>';
}

function academicsView() {
  const overall = aggregateAttendance();
  const subjectsHtml = state.subjects.map(function (subject) {
    const pct = attendancePercent(subject);
    const warning = pct < 75 ? '<span class="warning">Below 75%</span>' : '<span class="tag green">On track</span>';
    return '<div class="subject">' +
      '<div><div class="subject-title">' + escapeHtml(subject.n) + '</div>' +
      '<div class="meta">' + subject.att + ' / ' + subject.tot + ' classes · ' + escapeHtml(subject.grade) + ' · ' + subject.credits + ' credits</div>' +
      '<div class="subject-bar"><div class="subject-fill" style="width:' + pct + '%"></div></div></div>' +
      '<div class="subject-pct">' + pct + '%<br>' + warning + '</div>' +
      '</div>';
  }).join("");

  return pageHeader("Student view", "Academics & Attendance", "Attendance, academic performance, BPUT projection, and today’s class schedule.") +
    '<div class="grid">' +
      '<section class="card col-7">' +
        '<h3>Attendance Overview</h3>' +
        '<div class="ring-wrap">' +
          '<div class="ring"><div class="ring-content"><strong>' + overall + '%</strong><span>aggregate attendance</span></div></div>' +
          '<div class="stack" style="flex:1">' +
            '<div class="metrics">' +
              '<div class="metric"><div class="label">Attendance</div><div class="value">' + overall + '%</div></div>' +
              '<div class="metric"><div class="label">Target</div><div class="value">75%</div></div>' +
            '</div>' +
            '<div class="notice"><strong>BPUT 75% rule:</strong> maintain at least 75% attendance for regular eligibility. Current aggregate is ' + overall + '%.</div>' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<section class="card col-5">' +
        '<h3>Predictive Attendance</h3>' +
        '<div class="metrics">' +
          '<div class="metric"><div class="label">After 2 classes</div><div class="value">74.2%</div></div>' +
          '<div class="metric"><div class="label">After 5 classes</div><div class="value">69.8%</div></div>' +
          '<div class="metric"><div class="label">Classes needed</div><div class="value">4</div></div>' +
          '<div class="metric"><div class="label">CGPA</div><div class="value">8.64</div></div>' +
        '</div>' +
        '<div class="meta" style="margin-top:10px">SGPA 8.40 · Current semester credits tracked in the academic record.</div>' +
      '</section>' +

      '<section class="card col-7">' +
        '<h3>Subject Breakdown</h3>' +
        subjectsHtml +
      '</section>' +

      '<section class="card col-5">' +
        '<h3>Academic Snapshot</h3>' +
        '<div class="stack">' +
          '<div class="row"><span class="muted">Current SGPA</span><strong>8.40</strong></div>' +
          '<div class="row"><span class="muted">Current CGPA</span><strong>8.64</strong></div>' +
          '<div class="row"><span class="muted">Credits this term</span><strong>22</strong></div>' +
          '<div class="row"><span class="muted">Attendance target</span><strong>75%</strong></div>' +
        '</div>' +
      '</section>' +

      '<section class="card col-12">' +

/* ----------------------------- Render ----------------------------- */

function renderNav() {
  const nav = document.getElementById("nav");
  if (!nav) return;
  nav.innerHTML = NAV_ITEMS.map(function (item) {
    return '<button type="button" class="' + (state.role === item[0] ? "active" : "") + '" onclick="setRole(\'' + item[0] + '\')">' + item[1] + '</button>';
  }).join("");
}

function renderMain() {
  const main = document.getElementById("main");
  if (!main) return;

  let html = "";
  switch (state.role) {
    case "hostel":
      html = hostelView();
      break;
    case "grievances":
      html = grievancesView();
      break;
    case "announcements":
      html = announcementsView();
      break;
    case "warden":
      html = wardenView();
      break;
    case "gate":
      html = gateView();
      break;
    case "offgrid":
      html = offgridView();
      break;
    case "academics":
    default:
      html = academicsView();
      break;
  }
  main.innerHTML = html;
}

function render() {
  renderNav();
  renderMain();
}

/* ----------------------------- Safe startup ----------------------------- */

document.addEventListener("DOMContentLoaded", function () {
  try {
    render();
  } catch (error) {
    const main = document.getElementById("main");
    if (main) {
      main.innerHTML =
        '<section class="card"><h2>Campus Doer could not render this view.</h2>' +
        '<p class="meta">A runtime error was caught during startup. Please refresh the page.</p></section>';
    }
    console.error("Campus Doer render error:", error);
  }
});
</script>
