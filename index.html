<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Doer · University Operations</title>
<style>
   :root{
  --bg:#0D0F14;
  --surface:#161922;
  --surface-2:#1B1E28;
  --line:#2A2F3D;
  --line-strong:#343B4B;
  --ink:#EDEDF2;
  --muted:#9BA3B2;
  --accent:#C2410C;
  --accent-dark:#A8321D;
  --mustard:#D97706;
  --green:#15803D;
  --red:#A8321D;
  --green-soft:#14271D;
  --mustard-soft:#2B2113;
  --red-soft:#2A1718;
  --ok:#15803D;
  --warn:#D97706;
  --shadow:0 4px 16px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,serif;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-header{
  position:sticky;top:0;z-index:30;
  background:#12151D;
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1180px;margin:auto;padding:20px 24px 17px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand-mark{
  width:42px;height:42px;border-radius:8px;
  display:grid;place-items:center;
  background:var(--accent);color:#fff;font-weight:800;
  letter-spacing:-.04em;
}
.brand h1{
  margin:0;font-family:Georgia,"Times New Roman",serif;
  font-size:20px;font-weight:700;letter-spacing:-.02em;
}
.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}
.header-actions{display:flex;align-items:center;gap:10px}
.live{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px;border:1px solid #B9D7C0;border-radius:999px;
  color:var(--green);background:var(--green-soft);
  font-size:11px;font-weight:800;
}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.live.off{color:#8A5A0A;background:var(--mustard-soft);border-color:#EBCB91}
.live.off .dot{background:var(--mustard)}
.sos{
  border:1px solid var(--red);background:var(--red);color:#fff;
  border-radius:7px;padding:8px 12px;font-size:12px;font-weight:800;
}
.sos:hover{background:#922B1C}
.sos.armed{outline:3px solid rgba(168,50,29,.15)}
.nav-wrap{
  background:#12151D;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:1180px;margin:auto;padding:8px 24px;
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav button{
  flex:0 0 auto;border:1px solid transparent;background:transparent;
  color:var(--muted);padding:9px 13px;border-radius:6px;
  font-size:12px;font-weight:700;white-space:nowrap;
}
.nav button:hover{color:var(--accent);background:#1B1E28}
.nav button.active{
  background:var(--accent);color:#fff;border-color:var(--accent);
}
main{max-width:1180px;margin:auto;padding:30px 24px 75px}
.view-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:20px;margin-bottom:20px;padding-bottom:15px;
  border-bottom:1px solid var(--line);
}
.view-head h2{
  margin:0;font-family:Georgia,"Times New Roman",serif;
  font-size:26px;letter-spacing:-.025em;font-weight:700;
}
.view-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.view{display:none}
.view.active{display:block}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:21px;box-shadow:var(--shadow);
}
.card + .card{margin-top:15px}
.card h3{
  margin:0 0 14px;font-family:Georgia,"Times New Roman",serif;
  font-size:16px;font-weight:700;
}
.card h4{
  margin:19px 0 9px;font-size:11px;color:var(--muted);
  font-weight:800;text-transform:uppercase;letter-spacing:.05em;
}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.metric{
  background:#202534;border:1px solid var(--line);
  border-radius:6px;padding:15px;
}
.metric strong{
  display:block;font-family:Georgia,"Times New Roman",serif;
  font-size:23px;letter-spacing:-.03em;
}
.metric span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.row{display:flex;gap:11px;flex-wrap:wrap}
.row > *{flex:1;min-width:150px}
label{
  display:block;margin:9px 0 5px;color:var(--muted);
  font-size:11px;font-weight:700;
}
input,select,textarea{
  width:100%;border:1px solid var(--line-strong);border-radius:5px;
  background:#202534;color:var(--ink);padding:10px 11px;
  outline:none;font-size:12px;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(194,65,12,.09);
}
.check{
  display:flex;align-items:center;gap:8px;color:var(--ink);
  margin-top:12px;font-size:12px;font-weight:600;
}
.check input{width:auto;accent-color:var(--accent)}
.primary,.secondary,.danger,.small-btn{
  border-radius:5px;padding:9px 13px;font-size:12px;font-weight:800;
}
.primary{border:1px solid var(--accent);background:var(--accent);color:white}
.primary:hover{background:var(--accent-dark)}
.secondary,.small-btn{
  border:1px solid var(--line-strong);background:#1B202D;color:var(--ink)
}
.secondary:hover,.small-btn:hover{
  border-color:var(--accent);color:var(--accent);background:#202534
}
.danger{
  border:1px solid #C27A68;background:var(--red-soft);color:var(--red)
}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{
  display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line-strong);background:#202534;
  color:#9BA3B2;padding:4px 8px;border-radius:999px;
  font-size:10px;font-weight:800;
}
.pill.ok{border-color:#B9D7C0;background:var(--green-soft);color:var(--green)}
.pill.warn{border-color:#EBCB91;background:var(--mustard-soft);color:#9A5A00}
.pill.bad{border-color:#D9A49A;background:var(--red-soft);color:var(--red)}
.pill.blue{border-color:#B9C9D7;background:#202534;color:#9FB9CC}
.list{display:flex;flex-direction:column}
.list-item{
  padding:13px 0;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
}
.list-item:first-child{border-top:0}
.meta{color:var(--muted);font-size:11px}
.muted{color:var(--muted)}
.attendance-layout{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{
  width:116px;height:116px;border-radius:50%;
  display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--accent) 0 72%, #2A2F3D 72% 100%);
}
.ring:after{
  content:"";position:absolute;inset:10px;border-radius:50%;
  background:#1B202D;
}
.ring strong{
  position:relative;z-index:1;
  font-family:Georgia,"Times New Roman",serif;font-size:23px;
}
.sim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.sim{
  border:1px solid var(--line);border-radius:6px;padding:12px;
  background:#202534;
}
.sim strong{display:block;font-size:13px}
.sim span{font-size:10px;color:var(--muted)}
.subject{
  border:1px solid var(--line);border-radius:6px;padding:14px;
  background:#202534;
}
.subject strong{
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;display:block;
}
.progress{height:5px;background:#2A2F3D;border-radius:999px;margin:10px 0}
.progress i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.warning-note{
  border:1px solid #EBCB91;background:var(--mustard-soft);
  border-radius:6px;padding:11px;color:#E0A85C;font-size:11px;
}
.hero-strip{
  border:1px solid var(--line);background:#1B1E28;border-radius:6px;
  padding:12px 14px;margin-bottom:14px;font-size:11px;color:var(--muted)
}
.hero-strip b{color:var(--ink)}
.query{
  border-left:3px solid var(--accent);background:#1B1E28;
  padding:10px 12px;border-radius:0 5px 5px 0;font-size:12px;
}
.room{
  display:flex;justify-content:space-between;align-items:center;
  border:1px solid var(--line);padding:11px;border-radius:6px;
  background:#202534
}
.room b{font-size:13px}
.room span{font-size:11px;color:var(--muted)}
.meal{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  border-top:1px solid var(--line);padding:13px 0
}
.meal:first-child{border-top:0}
.rating{display:flex;gap:5px}
.rating button{padding:5px 8px}
.qr{
  width:72px;height:72px;border:1px solid var(--line-strong);border-radius:5px;
  background:
    repeating-linear-gradient(0deg,#7D8796 0 4px,transparent 4px 8px),
    repeating-linear-gradient(90deg,#7D8796 0 4px,transparent 4px 8px);
  opacity:.78;
}
.booking{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  border-top:1px solid var(--line);padding:12px 0
}
.booking:first-child{border-top:0}
.announcement{
  border:1px solid var(--line);border-radius:6px;padding:13px;
  background:#202534
}
.announcement + .announcement{margin-top:8px}
.announcement p{margin:7px 0 0;font-size:12px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-bar button.active{
  background:var(--accent);border-color:var(--accent);color:white
}
.sos-banner{
  position:fixed;left:18px;right:18px;top:100px;z-index:50;
  max-width:900px;margin:auto;background:#24181A;border:1px solid #D9A49A;
  color:var(--red);border-radius:7px;padding:13px 15px;
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  box-shadow:0 8px 24px rgba(0,0,0,.08)
}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:#EDEDF2;color:#fff;border-radius:5px;padding:9px 14px;
  font-size:12px;font-weight:800;opacity:0;pointer-events:none;
  transition:.2s;z-index:60
}
.toast.show{opacity:1}
.pin-card{max-width:390px;margin:50px auto}
.term{
  background:#0B0D11;border:1px solid #4B463F;border-radius:6px;
  min-height:180px;padding:13px;color:#F2D7A0;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  white-space:pre-wrap;overflow:auto
}
.term-line{margin-bottom:5px}
.admin-top{
  display:flex;justify-content:space-between;gap:10px;
  align-items:center;flex-wrap:wrap
}
.empty{padding:18px 0;color:var(--muted);font-size:12px}
@media(max-width:820px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr}
  .grid-2{grid-template-columns:1fr}
}
@media(max-width:620px){
  .header-inner{align-items:flex-start;padding:16px 15px}
  .brand p{max-width:210px}
  .live{display:none}
  .attendance-layout{grid-template-columns:1fr}
  .ring{margin:auto}
  .sim-grid{grid-template-columns:1fr}
  main{padding:22px 14px 55px}
  .nav{padding:7px 14px}
  .view-head h2{font-size:22px}
}

/* Dark inversion fixes */
.filter,
.filters button,
.filter-pill,
.filter-tag,
.tag,
.chip,
button.ghost,
button.utility,
.utility-btn,
.action-btn,
.card button.ghost {
  background:#1B202D;
  border:1px solid #2A3347;
  color:#EDEDF2;
}

button.ghost:hover,
button.utility:hover,
.utility-btn:hover,
.action-btn:hover,
.card button.ghost:hover,
.filter:hover,
.filters button:hover,
.filter-pill:hover,
.filter-tag:hover {
  border-color:#C2410C;
  color:#FFFFFF;
  background:#1B202D;
}

input,
select,
textarea,
input[type="date"],
input[type="time"],
input[type="number"],
input[type="text"] {
  background:#131722;
  border-color:#2A3347;
  color:#EDEDF2;
}

input::placeholder,
textarea::placeholder {
  color:#7F899A;
}

select option {
  background:#131722;
  color:#EDEDF2;
}

.ring {
  color:#EDEDF2 !important;
}

.ring strong,
.attendance-ring strong {
  color:#EDEDF2 !important;
  background:transparent !important;
}

.pill,
.status-pill,
.badge,
.meta-pill {
  color:#EDEDF2;
}

.pill.blue,
.pill.ok,
.pill.warn,
.pill.danger {
  border-color:#2A3347;
}

button {
  color:#EDEDF2;
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">CD</div>
      <div>
        <h1>Campus Doer</h1>
        <p>Digital Operations &amp; Campus Services</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="live" id="livePill"><span class="dot"></span> Operational</span>
      <button class="sos" id="sosBtn" onclick="sosClick()">🚨 Medical SOS</button>
    </div>
  </div>
  <div class="nav-wrap">
    <nav class="nav" id="nav"></nav>
  </div>
</header>

<main id="main"></main>
<div class="toast" id="toast"></div>
<div id="sosArea"></div>

<script>
const state = {
  role:'student', offline:false,
  tickets:[
    {id:'T-101',cat:'Plumbing',studentName:'Rohan Das',hostel:'Hostel B',room:'214',desc:'Washroom tap loose and leaking continuously since yesterday',urgency:'High',status:'In Progress',assignedStaff:'Ramesh (Plumber)',age:20},
    {id:'T-102',cat:'Plumbing',studentName:'Aarav Sharma',hostel:'Hostel B',room:'208',desc:'Very low water pressure in Wing 2 washroom',urgency:'Medium',status:'In Progress',assignedStaff:'Ramesh (Plumber)',age:30},
    {id:'T-103',cat:'Electrical',studentName:'Priya Mohanty',hostel:'Hostel C',room:'118',desc:'Ceiling fan making vibrating grinding noise at speed 3',urgency:'High',status:'Logged',assignedStaff:'Kailash (Electrician)',age:52},
    {id:'T-104',cat:'Mess',studentName:'Aarav Sharma',hostel:'Hostel B',room:'208',desc:'Mess dinner cold, shortage of dal',urgency:'Low',status:'Logged',assignedStaff:'Das (Mess Manager)',age:6},
  ],
  passes:[{id:'GP-201',dest:'Cuttack (Home)',dep:'2026-10-02',ret:'2026-10-04',reason:'Family function',status:'Pending',otp:null,qr:false,studentName:'Priya Mohanty',room:'118',student:'Priya Mohanty · Rm 118'}],
  passSeq:202,
  student:{name:'Rohan Das',roll:'230110145',hostel:'Hostel B',room:'214'},
  subjects:[
  {n:'Mathematics',att:22,tot:26,credits:4,grade:'Grade O'},
  {n:'Basic Electrical (BE)',att:18,tot:24,credits:4,grade:'Grade E'},
  {n:'Chemistry',att:20,tot:25,credits:4,grade:'Grade A'},
  {n:'Universal Human Values (UHV)',att:19,tot:22,credits:3,grade:'Grade O'},
  {n:'Programming in C & Data Structures (DS)',att:21,tot:26,credits:4,grade:'Grade E'},
  {n:'Basic Civil Engineering (BCE)',att:17,tot:24,credits:3,grade:'Grade A'}
],
  feed:[{cat:'Academic',text:'Mid-sem lab schedule released. Check your timetable.'},{cat:'Hostel',text:'Water tanker maintenance tomorrow 6-8 AM (Hostel B).'},{cat:'Emergency',text:'Fire drill Friday 4 PM. Assemble at the main gate.'}],
  timetable:[
  {t:'8:00 – 10:45 AM',s:'Chemistry Lab',h:'Chem Lab',st:'Today'},
  {t:'10:45 – 11:40 AM',s:'Break / Recess',h:'',st:'Today'},
  {t:'11:40 AM – 12:35 PM',s:'Basic Electrical (BE)',h:'LH-1',st:'Today'},
  {t:'12:35 – 1:30 PM',s:'Programming in C & DS',h:'LH-3',st:'Today'},
  {t:'1:30 – 2:25 PM',s:'Basic Civil Engineering (BCE)',h:'LH-2',st:'Today'}
],
  sos:null,
  acad:{cgpa:'8.64',sgpa:'8.40',subs:[
  {n:'Mathematics',cr:4,g:'O'},
  {n:'Basic Electrical (BE)',cr:4,g:'E'},
  {n:'Chemistry',cr:4,g:'A'},
  {n:'Universal Human Values (UHV)',cr:3,g:'O'},
  {n:'Programming in C & Data Structures (DS)',cr:4,g:'E'},
  {n:'Basic Civil Engineering (BCE)',cr:3,g:'A'}
]},
  roster:[{name:'Aarav Sharma',hostel:'Hostel B',room:'208'},{name:'Sourav Behera',hostel:'Hostel B',room:'210'},{name:'Rohan Das',hostel:'Hostel B',room:'214'},{name:'Debashish Nayak',hostel:'Hostel B',room:'216'},{name:'Priya Mohanty',hostel:'Hostel C',room:'118'}],
  bookings:[{id:'B-1',res:'Seminar Hall',date:'2026-10-05',slot:'8:00–9:30 PM',why:'Robotics Club workshop',by:'Aarav Sharma',status:'Pending'}],
  totalHostellers:250,studentsSkippingDinner:14,initialDinnerForecast:224,onLeave:12,meals:[{n:'Breakfast',t:'7:00–8:00 AM',menu:'Poha, Tea'},{n:'Lunch',t:'2:30–3:30 PM',menu:'Rice, Dal, Aloo Gobi, Curd'},{n:'Snacks',t:'5:00–5:45 PM',menu:'Samosa, Chai'},{n:'Dinner',t:'8:00–9:30 PM',menu:'Roti, Paneer Curry, Salad'}],
  rate:{Breakfast:{Good:9,OK:3,Poor:1},Lunch:{Good:14,OK:5,Poor:2},Snacks:{Good:11,OK:4,Poor:0},Dinner:{Good:8,OK:6,Poor:3}},
  isAdminLoggedIn:false, adminPin:'1234',
};

const views = [
  ["academics","Academics & Attendance"],
  ["hostel","Hostel & Living"],
  ["grievances","Campus Grievances & Repairs"],
  ["facilities","Announcements & Facilities"],
  ["warden","Warden Command"],
  ["gate","Gate Checkpoint"],
  ["offgrid","Off-Grid Resilience"]
];

let activeView = "academics";
let dinnerToday = true;
let announcementFilter = "All";
let sosArmed = false;

const STAFF = {
  "Others":"Campus Operations Desk",
  "Plumbing":"Ramesh (Plumber)",
  "Electrical":"Kailash (Electrician)",
  "Campus Wi-Fi / Labs":"IT Support Desk",
  "Classroom Furniture":"Campus Maintenance",
  "Canteen Hygiene":"Das (Mess Manager)",
  "Ragging / Corridor Noise":"Warden on duty"
};

const STAFF_LIST = Object.values(STAFF);

function toast(message){
  const box = document.getElementById("toast");
  box.textContent = message;
  box.classList.add("show");
  setTimeout(function(){ box.classList.remove("show"); }, 1800);
}

function statusTag(status){
  if(["Resolved","Approved","Checked Out"].includes(status)) return "ok";
  if(status === "Rejected") return "bad";
  return "warn";
}

function ageTag(age){
  if(age >= 48) return "warn";
  return "blue";
}

function setView(view){
  activeView = view;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function toggleOffline(){
  state.offline = !state.offline;
  updateNetworkBadge();
  toast(state.offline ? "Offline / 2G simulation enabled" : "Live gateway restored");
}

function updateNetworkBadge(){
  const pill = document.getElementById("livePill");
  pill.className = "live" + (state.offline ? " off" : "");
  pill.innerHTML = '<span class="dot"></span> ' +
    (state.offline ? "Offline / 2G Simulation" : "Operational");
}

function attStats(){
  return {a:72,t:100,pct:72,ok:false,need:4};
}

function ring(){
  const totalAtt = state.subjects.reduce(function(sum,s){return sum+s.att;},0);
  const totalClasses = state.subjects.reduce(function(sum,s){return sum+s.tot;},0);
  const pct = Math.round((totalAtt / totalClasses) * 1000) / 10;
  return '<div class="ring" style="background:conic-gradient(var(--accent) 0 ' + pct + '%, #2A2F3D ' + pct + '% 100%)">' +
    '<strong>' + pct + '%</strong></div>';
}

function myPasses(){
  return state.passes.filter(function(p){return p.studentName === state.student.name;});
}

function submitPass(){
  const dest = document.getElementById("pDest").value.trim() || "HOME";
  const dep = document.getElementById("pDep").value || "—";
  const ret = document.getElementById("pRet").value || "—";
  const reason = document.getElementById("pReason").value.trim() || "Leave request";
  const id = "GP-" + state.passSeq++;
  const s = state.student;

  state.passes.unshift({
    id:id,dest:dest,dep:dep,ret:ret,reason:reason,status:"Pending",
    otp:null,qr:false,studentName:s.name,room:s.room,
    student:s.name+" · Rm "+s.room
  });

  toast((state.offline ? "Queued offline · " : "") + id + " submitted");
  render();
}

function submitTicket(){
  const cat = document.getElementById("mCat").value;
  const desc = document.getElementById("mDesc").value.trim();
  const anon = document.getElementById("mAnon").checked;

  if(!desc){
    toast("Add a short description");
    return;
  }

  const id = "T-" + (101 + state.tickets.length);
  const s = state.student;

  state.tickets.unshift({
    id:id,cat:cat,studentName:s.name,hostel:s.hostel,room:s.room,
    desc:desc,urgency:"Medium",status:"Logged",
    assignedStaff:STAFF[cat],age:0,anon:anon
  });

  toast(id + " logged");
  render();
}

function setTicketStatus(id,status){
  const ticket = state.tickets.find(function(t){return t.id === id;});
  if(ticket) ticket.status = status;
  toast(id + " marked " + status);
  render();
}

function reassignTicket(id){
  const ticket = state.tickets.find(function(t){return t.id === id;});
  if(!ticket) return;

  const current = STAFF_LIST.indexOf(ticket.assignedStaff);
  ticket.assignedStaff = STAFF_LIST[(current + 1) % STAFF_LIST.length];
  toast(id + " reassigned");
  render();
}

function approvePass(id){
  const pass = state.passes.find(function(p){return p.id === id;});
  if(!pass) return;
  pass.status = "Approved";
  pass.otp = String(Math.floor(1000 + Math.random() * 9000));
  pass.qr = true;
  toast(id + " approved · OTP generated");
  render();
}

function rejectPass(id){
  const pass = state.passes.find(function(p){return p.id === id;});
  if(!pass) return;
  pass.status = "Rejected";
  toast(id + " rejected");
  render();
}

function rateMeal(meal,key){
  state.rate[meal][key]++;
  toast("Thanks for rating " + meal);
  render();
}

function toggleSkipDinner(skipping){
  const wasSkipping = !!state.studentSkippingDinner;
  if(skipping && !wasSkipping){
    state.studentsSkippingDinner += 1;
  }else if(!skipping && wasSkipping){
    state.studentsSkippingDinner = Math.max(0, state.studentsSkippingDinner - 1);
  }
  state.studentSkippingDinner = skipping;
  render();
}

function submitBooking(){
  const resource = document.getElementById("bRes").value;
  const date = document.getElementById("bDate").value || "—";
  const slot = document.getElementById("bSlot").value;
  const purpose = document.getElementById("bWhy").value.trim();

  if(!purpose){
    toast("Add the club or purpose");
    return;
  }

  state.bookings.unshift({
    id:"B-" + (state.bookings.length + 1),
    res:resource,date:date,slot:slot,why:purpose,
    by:state.student.name,status:"Pending"
  });

  toast("Booking request sent");
  render();
}

function setBooking(id,status){
  const booking = state.bookings.find(function(b){return b.id === id;});
  if(booking) booking.status = status;
  toast(id + " " + status);

}

function loginAdmin(pin){
  const error = document.getElementById("pinError");

  if(pin === state.adminPin){

function sosClick(){
  const button = document.getElementById("sosBtn");

  if(!sosArmed){
    sosArmed = true;
    button.textContent = "Tap again to confirm";
    button.classList.add("armed");

    setTimeout(function(){
      sosArmed = false;
      button.textContent = "🚨 Medical SOS";
      button.classList.remove("armed");
    },4000);

    return;
  }

  sosArmed = false;
  button.textContent = "🚨 Medical SOS";
  button.classList.remove("armed");

  const s = state.student;
  state.sos = {
    by:s.name,hostel:s.hostel,room:s.room,
    time:new Date().toLocaleTimeString()
  };

  toast("Emergency alert sent");
  render();
}

function verifyPass(){
  const code = document.getElementById("otpIn").value.trim();
  const result = document.getElementById("guardResult");
  const pass = state.passes.find(function(p){
    return (p.otp === code || p.id === code) && p.status === "Approved";
  });

  if(pass){
    pass.status = "Checked Out";
    result.innerHTML =
      '<div class="card" style="margin-top:12px;border-color:#14532D">' +
      '<span class="pill ok">● Authorized Departure</span>' +
      '<p><b>' + pass.student + '</b></p>' +
      '<div class="meta">Destination: ' + pass.dest +
      ' · Return: ' + pass.ret + ' · ' + pass.id + '</div></div>';
    toast("Checkout recorded");
    render();
  }else{
    result.innerHTML =
      '<div class="card" style="margin-top:12px;border-color:#991B1B">' +
      '<span class="pill bad">● Denied / Invalid</span>' +
      '<p class="meta">No approved pass matches that OTP or Pass ID.</p></div>';
  }
}

function runSms(){
  const input = document.getElementById("smsIn");
  const log = document.getElementById("smsLog");
  const command = input.value.trim();

  if(!command) return;

  function line(text){
    const div = document.createElement("div");
    div.className = "term-line";
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  line("> " + command);
  input.value = "";

  const parts = command.split(/\s+/);

  if(parts[0] === "GATE" && parts[1] === "LEAVE" && parts.length >= 5){
    const dep = parts[2];
    const ret = parts[3];
    const dest = parts.slice(4).join(" ");
    const id = "GP-" + state.passSeq++;

    state.passes.unshift({
      id:id,dest:dest,dep:dep,ret:ret,reason:"SMS fallback request",
      status:"Pending",otp:null,qr:false,
      studentName:state.student.name,room:state.student.room,
      student:state.student.name+" · Rm "+state.student.room
    });

    line("SMS CONFIRM: " + id + " queued for approval.");
  }else if(parts[0] === "STATUS" && parts[1]){
    const pass = state.passes.find(function(p){return p.id.includes(parts[1]);});
    line(pass ? "SMS: " + pass.id + " is " + pass.status +
      (pass.otp ? " · OTP " + pass.otp : "") :
      "SMS: No matching request found.");
  }else{
    line("SYNTAX ERROR. Try: GATE LEAVE 2026-10-02 2026-10-04 HOME");
  }
}

        '<div class="hero-strip" style="margin-top:14px"><b>Current mode:</b> ' + (state.offline ? "Offline / queued actions" : "Live gateway") + '<br>Cached PWA footprint: 1.2MB.</div>' +
      '</div>' +
      '<div class="card"><h3>Legacy ERP Migration</h3><p class="meta">Bulk-import student rosters from a legacy CSV export.</p>' +
        '<button class="secondary" onclick="importCsv()">Simulate CSV Roster Import</button></div>' +
    '</div>' +
    '<div class="card"><h3>SMS / USSD Fallback Terminal</h3>' +
      '<div class="term" id="smsLog"><div class="term-line">Feature-phone terminal ready.</div><div class="term-line">Try: GATE LEAVE 2026-10-02 2026-10-04 HOME</div></div>' +
      '<div class="row" style="margin-top:10px"><input id="smsIn" placeholder="Type SMS command" onkeydown="if(event.key===\'Enter\')runSms()"><button class="primary" onclick="runSms()">Send</button></div>' +
      '<small class="meta">Supports STATUS &lt;pass id&gt;.</small>' +
    '</div>' +
  '</section>';
}

function sosBanner(){
  if(!state.sos) return "";
  const canClear = state.isAdminLoggedIn || activeView === "gate";
  return '<div class="sos-banner"><div><b>🚨 Medical SOS Active</b><div class="meta" style="color:#FECACA">' +
    state.sos.by + ' · ' + state.sos.hostel + ' · Room ' + state.sos.room + ' · ' + state.sos.time +
    '</div></div>' +
    (canClear ? '<button class="danger" onclick="clearSos()">Clear Alert</button>' : '') +
    '</div>';
}

function render(){
  const nav = document.getElementById("nav");

  nav.innerHTML = views.map(function(item){
    return '<button class="' + (activeView === item[0] ? "active" : "") +
      '" onclick="setView(\'' + item[0] + '\')">' + item[1] + '</button>';
  }).join("");

  let content = "";

  if(activeView === "academics") content = academicsView();
  if(activeView === "hostel") content = hostelView();
  if(activeView === "grievances") content = grievancesView();
  if(activeView === "facilities") content = facilitiesView();
  if(activeView === "warden") content = wardenView();
  if(activeView === "gate") content = gateView();
  if(activeView === "offgrid") content = offgridView();

  document.getElementById("main").innerHTML = content;
  document.getElementById("sosArea").innerHTML = sosBanner();
  updateNetworkBadge();
}
