.home{background:var(--bg-canvas);min-height:calc(100vh - var(--hh,112px));display:flex;flex-direction:column;position:relative;overflow:hidden}
.home:before{content:"";position:absolute;inset:0;background:transparent;pointer-events:none}
.home:after{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.list-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:18px 0;border-bottom:1px solid var(--border-subtle)}

.tag.blue{color:var(--accent-status);border-color:rgba(0,210,255,.35);background:var(--accent-status-soft)}

/* Digital Clearance & Applications */
.digital-clearance-shell{display:grid;gap:22px}

.app-field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);font-weight:700}
.app-field input,.app-field select,.app-field textarea{width:100%;box-sizing:border-box;background:#0f0e0c;border:1px solid var(--border-subtle);border-radius:9px;color:var(--text-primary);font:inherit;padding:11px 12px;outline:none}
.app-field textarea{min-height:125px;resize:vertical;line-height:1.5}
.app-field input:focus,.app-field select:focus,.app-field textarea:focus{border-color:var(--accent-gold);box-shadow:0 0 0 3px var(--accent-primary-soft)}
.app-route-switch{display:flex;gap:8px;flex-wrap:wrap}
.app-route-option{position:relative}
.app-route-option input{position:absolute;opacity:0;pointer-events:none}
.app-route-option label{display:block;border:1px solid var(--border-subtle);border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--text-secondary);font-size:12px;font-weight:700;letter-spacing:.03em}
.app-route-option input:checked+label{border-color:var(--accent-gold);color:var(--accent-gold);background:var(--accent-primary-soft)}
.app-route-help{font-size:12px;color:var(--text-muted);margin-top:2px}
.app-submit-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:4px}
.app-submit-btn{border:1px solid var(--accent-gold);background:var(--accent-gold);color:var(--accent-on-primary);border-radius:999px;padding:11px 18px;font:700 12px inherit;letter-spacing:.04em;cursor:pointer}
.app-submit-btn:hover{filter:brightness(1.08)}
.app-submit-btn:disabled{opacity:.55;cursor:not-allowed}
.app-ledger{display:grid;gap:10px}
.app-row{display:grid;grid-template-columns:1.1fr 1.3fr 1fr .9fr 1.3fr;gap:14px;align-items:center;border:1px solid var(--border-subtle);border-radius:12px;padding:14px 15px;background:#100f0d}
.app-row-head{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:700;padding:0 15px;border:0;background:transparent}
.app-cell{min-width:0}
.app-cell .k{display:none;font-size:10px;text-transform:uppercase;color:var(--text-muted);letter-spacing:.07em;margin-bottom:4px}
.app-main{font-size:12px;color:var(--text-primary);font-weight:650}
.app-meta{font-size:11px;color:var(--text-secondary);margin-top:3px;line-height:1.4}
.app-status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:750;letter-spacing:.02em;white-space:nowrap}
.app-status.pending{background:rgba(212,163,89,.13);color:var(--accent-gold);border:1px solid rgba(212,163,89,.28)}
.app-status.forwarded{background:rgba(0,210,255,.10);color:var(--accent-blue);border:1px solid rgba(0,210,255,.24)}
.app-status.approved{background:rgba(0,224,84,.12);color:#00e054;border:1px solid rgba(0,224,84,.28)}
.app-status.rejected{background:rgba(190,70,70,.12);color:#d88989;border:1px solid rgba(190,70,70,.25)}
.app-row-actions{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.app-mini-btn{background:transparent;border:1px solid var(--border-subtle);color:var(--text-secondary);border-radius:999px;padding:6px 10px;font:600 10px inherit;cursor:pointer}
.app-mini-btn:hover{border-color:var(--accent-gold);color:var(--accent-gold)} .app-cell .app-mini-btn{padding:3px 7px;border:0;border-bottom:1px solid rgba(212,163,89,.35);border-radius:0;color:var(--text-primary)}
.app-empty{padding:28px;text-align:center;border:1px dashed var(--border-subtle);border-radius:12px;color:var(--text-muted);font-size:12px}
.app-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.app-modal{width:min(560px,100%);background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:16px;padding:24px;box-shadow:0 25px 80px rgba(0,0,0,.6)}
.app-modal h3{margin:0 0 9px;color:var(--text-primary);font-size:20px}
.app-modal p{color:var(--text-secondary);font-size:12px;line-height:1.6}
.app-stamp{border:1px solid rgba(0,224,84,.3);background:rgba(0,224,84,.07);border-radius:12px;padding:18px;margin-top:15px}
.app-stamp strong{color:#00e054}
.app-stamp code{color:var(--text-primary);font-size:12px}
@media(max-width:900px){
  .app-row{grid-template-columns:1fr 1fr}
  .app-row-head{display:none}
  .app-cell .k{display:block}
}
@media(max-width:650px){
  .app-form-grid{grid-template-columns:1fr}
  .app-field.full{grid-column:auto}
  .app-row{grid-template-columns:1fr}
  .app-submit-row{align-items:stretch;flex-direction:column}
}

<body>
<header>
  <div class="head"><div class="brand" style="cursor:pointer" onclick="goHome()"><div class="logo">CD</div><div><div class="title">Campus Doer</div><div class="sub">Digital Operations &amp; Campus Services</div></div></div><div class="header-actions"><button class="rolebtn" onclick="openRoles()">Log In / Switch Role</button><span class="role-chip" id="roleChip">Student</span>
<span class="gateway-chip">Live Gateway Active</span></div></div>
  <nav id="primaryNav" class="primary"></nav>
</header>
<div class="layout"><main id="main" class="content"></main></div>
<div id="editorialMenu" class="editorial-menu" aria-hidden="true" style="display:none"></div>
<div id="roleModal" class="rolemodal" style="display:none" onclick="if(event.target===this)closeRoles()"></div><div id="dispModal" class="rolemodal" style="display:none" onclick="if(event.target===this)closeDispatch()"></div>
<div id="toast" class="toast"></div>

<script>

/* Student Digital Clearance & Applications */
const APPLICATION_TYPES = [
  "On-Duty (OD) Attendance Claim (Hackathon / Event)",
  "Bonafide / Character Certificate Request",
  "Semester Examination / Clearance NOC",
  "Hostel Fee Concession / Payment Extension",
  "Special Leave of Absence"
];

const APPLICATION_STATUS = {
  pending_hod:{label:"Pending HOD Endorsement", cls:"pending"},
  pending_dean:{label:"Forwarded to Dean / Principal", cls:"forwarded"},
  approved:{label:"Approved & Digitally Stamped", cls:"approved"},
  rejected:{label:"Rejected", cls:"rejected"}
};

const APPLICATIONS_STORAGE_KEY = "campusdoer_applications_v1";

const DEFAULT_APPLICATIONS = [
  {
    id:"APP-2026-904",
    studentName:"Anika Rao",
    regNo:"2401289042",
    branch:"CSE",
    targetRole:"hod",
    targetDepartment:"CSE",
    type:"OD Attendance Claim",
    subject:"OD Attendance for BPUT Hackathon 2026",
    dates:"Oct 10 – Oct 12, 2026",
    reason:"Representing Trident in Hackathon Finals.",
    status:"pending_hod",
    attendanceAtSubmission:"79.6%",
    cgpa:"8.74",
    rejectionReason:null,
    eSignSignatureId:null,
    timestamp:"10 Oct 2026, 09:30 AM"
  }
];

function getApplications(){
  try{
    const raw=localStorage.getItem(APPLICATIONS_STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return DEFAULT_APPLICATIONS.map(a=>({...a}));
}
function saveApplications(list){
  try{ localStorage.setItem(APPLICATIONS_STORAGE_KEY,JSON.stringify(list)); }catch(e){}
}
function currentStudentIdentity(){
  const cred=typeof AUTH_CREDENTIALS!=="undefined" ? AUTH_CREDENTIALS.student : null;
  const student=typeof state!=="undefined" && state.student ? state.student : {};
  return {
    name: cred?.name || student.name || "Anika Rao",
    regNo: cred?.id || student.regNo || "2401289042",
    branch: "CSE",
    attendance: "79.6%",
    cgpa: "8.74"
  };
}
function applicationId(){
  const list=getApplications();
  let n=905;
  list.forEach(a=>{
    const m=String(a.id||"").match(/APP-2026-(\d+)/);
    if(m)n=Math.max(n,Number(m[1])+1);
  });
  return "APP-2026-"+n;
}
function formatApplicationDates(from,to){
  if(!from && !to)return "—";
  const fmt=s=>{
    const d=new Date(s+"T00:00:00");
    if(Number.isNaN(d.getTime()))return s;
    return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  };
  return from && to ? `${fmt(from)} – ${fmt(to)}` : fmt(from||to);
}
function routeTargetLabel(app){
  return app.targetRole==="hod" ? `HOD - ${app.targetDepartment||app.branch}` : "Dean Academics";
}
function applicationStatusMarkup(app){
  const s=APPLICATION_STATUS[app.status]||APPLICATION_STATUS.pending_hod;
  let actions="";
  if(app.status==="approved"){
    actions=`<button class="app-mini-btn" type="button" onclick="viewApplicationStamp('${app.id}')">View Stamp</button>`;
  }else if(app.status==="rejected"){
    actions=`<button class="app-mini-btn" type="button" onclick="viewApplicationRejection('${app.id}')">View Reason</button>`;
  }
  return `<span class="app-status ${s.cls}">${s.label}</span>${actions}`;
}
function renderStudentApplications(){
 const host=document.getElementById("studentApplicationsPanel");if(!host)return;
 const apps=getApplications().filter(a=>a.regNo===currentStudentIdentity().regNo);
 const sm={pending_hod:["Pending HOD","pending"],pending_dean:["Forwarded to Dean","forwarded"],approved:["Approved & E-Signed","approved"],rejected:["Rejected","rejected"]};
 let rows="";
 apps.forEach(a=>{const st=sm[a.status]||[a.status,"pending"];let action="";if(a.status==="approved")action='<button class="app-mini-btn" type="button" onclick="viewApplicationStamp(\''+a.id+'\')">View E-Sign</button>';else if(a.status==="rejected")action='<button class="app-mini-btn" type="button" onclick="viewApplicationRejection(\''+a.id+'\')">Reason</button>';rows+='<div class="app-row"><div class="app-cell"><span class="k">ID</span><div class="app-main">'+escapeHtml(a.id)+'</div></div><div class="app-cell"><span class="k">Type</span><div class="app-main">'+escapeHtml(a.type)+'</div><div class="app-meta">'+escapeHtml(a.subject||"")+'</div></div><div class="app-cell"><span class="k">Target</span><div class="app-main">'+escapeHtml(routeTargetLabel(a))+'</div></div><div class="app-cell"><span class="k">Status</span><span class="app-status '+st[1]+'">'+st[0]+'</span></div><div class="app-cell"><span class="k">Action</span><div class="app-row-actions">'+action+'</div></div></div>';});
 host.innerHTML='<div class="application-ledger-card"><h2>Live Application Tracker</h2><p class="subtle">Student → HOD → Dean / Principal clearance pipeline.</p><div class="app-ledger"><div class="app-row app-row-head"><div>ID</div><div>Type</div><div>Target</div><div>Status</div><div>Action</div></div>'+(rows||'<div class="app-empty">No applications submitted yet.</div>')+'</div></div>';
}
function submitStudentApplication(){if(state.currentRole!=="student"){toast("Student login is required.");return}const f=document.getElementById("studentApplicationForm");if(!f)return;const d=new FormData(f),route=d.get("targetRole"),dept=route==="hod"?d.get("targetDepartment"):null,type=String(d.get("applicationType")||""),reason=String(d.get("reason")||"").trim(),dates=String(d.get("dateText")||"").trim();if(!type||!reason||!dates){toast("Complete Type, Reason and Dates.");return}const me=currentStudentIdentity();const app={id:applicationId(),studentName:me.name,regNo:me.regNo,branch:me.branch,targetRole:route,targetDepartment:dept,type,subject:reason,dates,reason,status:route==="hod"?"pending_hod":"pending_dean",attendanceAtSubmission:me.attendance,cgpa:me.cgpa,rejectionReason:null,eSignSignatureId:null,timestamp:new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true})};const list=getApplications();list.unshift(app);saveApplications(list);f.reset();updateApplicationRouteUI();renderStudentApplications();toast(app.id+" submitted.")}
function updateApplicationRouteUI(){const route=document.getElementById("applicationRoute")?.value||"hod",wrap=document.getElementById("applicationDepartmentWrap"),dept=document.getElementById("applicationDepartment");if(wrap)wrap.style.display=route==="hod"?"flex":"none";if(dept)dept.required=route==="hod"}
function viewApplicationStamp(id){
  const app=getApplications().find(a=>a.id===id);
  if(!app)return;
  const signature=app.eSignSignatureId||`ESIGN-${app.id.replace("APP-","")}-CAMPUS`;
  openApplicationModal("Digital Approval Stamp",`
    <div class="app-stamp">
      <strong>APPROVED & DIGITALLY STAMPED</strong>
      <p><code>${escapeHtml(signature)}</code></p>
      <p>Application <b>${escapeHtml(app.id)}</b> has completed the academic clearance pipeline.</p>
      <p>Student: ${escapeHtml(app.studentName)} · ${escapeHtml(app.branch)}</p>
    </div>`);
}
function viewApplicationRejection(id){
  const app=getApplications().find(a=>a.id===id);
  if(!app)return;
  openApplicationModal("Application Rejected",`<p>${escapeHtml(app.rejectionReason||"No rejection reason was recorded.")}</p>`);
}
function openApplicationModal(title,body){
  document.getElementById("applicationModal")?.remove();
  const el=document.createElement("div");
  el.id="applicationModal";
  el.className="app-modal-backdrop";
  el.innerHTML=`<div class="app-modal"><h3>${escapeHtml(title)}</h3>${body}<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="app-mini-btn" type="button" onclick="document.getElementById('applicationModal')?.remove()">Close</button></div></div>`;
  el.addEventListener("click",e=>{if(e.target===el)el.remove()});
  document.body.appendChild(el);
}
function studentApplicationsModule(){if(state.currentRole!=="student")return card('<h3>Clearance &amp; Applications</h3><p class="meta">Student authentication is required.</p>');return `<div class="digital-clearance-shell"><section class="application-form-card"><div class="eyebrow">STUDENT DIGITAL APPLICATION DESK</div><h2>Clearance &amp; Applications</h2><p class="subtle">Submit a short-form request into the academic clearance pipeline.</p><form id="studentApplicationForm" onsubmit="event.preventDefault();submitStudentApplication()"><div class="app-form-grid"><div class="app-field"><label>Route To</label><select id="applicationRoute" name="targetRole" onchange="updateApplicationRouteUI()"><option value="hod">HOD</option><option value="dean">Dean / Principal</option></select></div><div id="applicationDepartmentWrap" class="app-field"><label>Branch</label><select id="applicationDepartment" name="targetDepartment"><option>CSE</option><option>ETC</option><option>EEE</option><option>Mech</option><option>Civil</option></select></div><div class="app-field"><label>Type</label><select name="applicationType"><option>OD Leave (Hackathon)</option><option>Bonafide Certificate</option><option>Clearance NOC</option></select></div><div class="app-field"><label>Dates</label><input id="applicationDates" name="dateText" placeholder="Oct 10-12, 2026" required></div><div class="app-field full"><label>Reason</label><input id="applicationReason" name="reason" placeholder="Formal reason / request" required></div><div class="app-field full"><button type="button" class="app-mini-btn" style="width:max-content" onclick="fillDemoODRequest()">Fill Demo OD Request</button></div></div><div class="app-submit-row"><span class="app-route-help">Live routing to the selected clearance desk.</span><button class="app-submit-btn" type="submit">Submit Application</button></div></form></section><div id="studentApplicationsPanel"></div></div>`}
function fillDemoODRequest(){const t=document.querySelector('#studentApplicationForm [name="applicationType"]'),r=document.getElementById("applicationReason"),d=document.getElementById("applicationDates");if(t)t.value="OD Leave (Hackathon)";if(r)r.value="OD for BPUT Hackathon Finals (Oct 10-12)";if(d)d.value="Oct 10-12, 2026";toast("Demo OD request filled.")}
function studentApplicationsView(){return head(section("academics"),["digital-clearance","Digital Clearance & Applications"])+studentApplicationsModule()}
return head(s,t)+card('<h3>Attendance Pulse &amp; BPUT Calculator</h3><div class="ring-wrap"><div class="ring"><b>79.6%</b></div><div class="stack" style="flex:1"><div class="metrics"><div class="metric"><span>Overall</span><b>79.6%</b></div><div class="metric"><span>BPUT cutoff</span><b>75%</b></div><div class="metric"><span>SGPA</span><b>8.40</b></div><div class="metric"><span>CGPA</span><b>8.64</b></div></div><div class="success"><strong>Above BPUT cutoff.</strong> Current first-year attendance pulse is 79.6%'+(state.bputAttendanceBoost?" · +"+state.bputAttendanceBoost+" OD lectures credited":"")+'.</div></div></div>');
function hostelTool(){const s=section("hostel"),t=tab(s);if(t[0]==="request-pass")return head(s,t)+card('<h3>Request Gate Pass</h3><form id="passForm" onsubmit="submitPass(event)" class="form"><label class="field">Student name<input name="student" value="Anika Rao" required></label><label class="field">Room<input name="room" value="214" required></label><label class="field full">Purpose<select name="purpose"><option>Family visit</option><option>Medical appointment</option><option>Personal work</option><option>Academic activity</option></select></label><div class="full"><button class="primary">Submit Gate Pass Request</button></div></form>');if(t[0]==="pass-history")return head(s,t)+card('<h3>My Pass History &amp; OTP</h3><table><thead><tr><th>Pass</th><th>Purpose</th><th>Status</th></tr></thead><tbody>'+state.passes.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.purpose)+'</td><td><span class="tag '+(x.status==="Approved"?"green":x.status==="Rejected"?"red":"amber")+'">'+esc(x.status)+'</span></td></tr>').join("")+'</tbody></table><div class="divider"></div><div class="notice">Your approved pass OTPs: <strong>'+myOtps()+'</strong> · Gate verification updates Parent Portal campus status.</div>');if(t[0]==="mess")return head(s,t)+card('<h3>Mess Timings &amp; Routine</h3><div class="timeline"><div><span class="time">7:00–8:00 AM</span><br><strong>Breakfast</strong></div><div><span class="time">2:30–3:30 PM</span><br><strong>Lunch</strong></div><div><span class="time">5:00–5:45 PM</span><br><strong>Snacks</strong></div><div><span class="time">8:00–9:30 PM</span><br><strong>Dinner</strong></div></div>');return head(s,t)+card('<h3>Opt-Out Dinner Headcount</h3><div class="success"><strong>Meals to prepare: '+meals()+'</strong> · 250 − 12 on leave − '+state.studentsSkippingDinner+' opted out.</div><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" '+(state.currentStudentSkippedDinner?"checked":"")+' onchange="toggleSkipDinner(this.c function fireSubmit(f){if(typeof f.onsubmit==="function")f.onsubmit({preventDefault(){},target:f,currentTarget:f})}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(!b)return;const f=b.form;if(!f)return;const t=(b.getAttribute("type")||"submit").toLowerCase();if(t!=="submit")return;e.preventDefault();fireSubmit(f)},true);
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const t=e.target;if(!t||t.tagName!=="INPUT"||["checkbox","radio","button","submit"].includes(t.type))return;const f=t.form;if(!f)return;e.preventDefault();fireSubmit(f)},true);
const METRICS=[["79.6%","BPUT Attendance Pulse","Active threshold guard"],["0.00s","Gate Clearance Delay","Offline OTP/QR authentication"],["1.2 MB","Cached PWA Footprint","2G / Low-Bandwidth ready"],["1-Tap","Nightly Dinner Opt-Out","Zero mess waste"]];
function homeView(){return '<div class="home"><section class="hero"><div class="hero-in"><div class="hk">CAMPUS OPERATIONS // ARCHITECTURE STANDARD</div><h1 class="hh">Campus Doer</h1><p class="hs">An offline-first operational standard connecting students, residential wardens, security checkpoints, and guardians across campus institutions.</p><div class="ha"><button class="hb hb-solid" onclick="openDirectory()">EXPLORE SYSTEM DIRECTORY</button>'+(can("offgrid")?'<button class="hb hb-line" onclick="jumpOffgrid()">OFF-GRID SIMULATOR</button>':'')+'</div></div></section><section class="hm">'+METRICS.map(m=>'<div><b>'+m[0]+'</b><span>'+m[1]+'</span><small>'+m[2]+'</small></div>').join("")+'</section></div>'}
function goHome(){state.home=true;state.menuOpen=false;render();window.scrollTo(0,0)}
function openDirectory(){state.menuOpen=true;render()}
function jumpOffgrid(){if(!can("offgrid")){deny("offgrid");return}state.activeSection="offgrid";state.activeSubTab="terminal";state.menuOpen=false;state.home=false;render();window.scrollTo(0,0)}
const APPLICATIONS=[
 {id:"APP-2026-014",student:"Rohan Das",roll:"2401289042",branch:"CSE",type:"Bonafide / Academic Certificate",purpose:"Scholarship submission",submitted:"2026-10-07",status:"Pending HOD",hodNote:"",deanNote:""},
 {id:"APP-2026-011",student:"Anika Rao",roll:"2401289018",branch:"CSE",type:"Semester Exchange Request",purpose:"Industry semester at partner institution",submitted:"2026-10-05",status:"HOD Endorsed",hodNote:"Academic standing verified; no attendance block.",deanNote:""},
 {id:"APP-2026-009",student:"Priya Nair",roll:"2401289033",branch:"ECE",type:"Research Project Approval",purpose:"Faculty-guided embedded systems project",submitted:"2026-10-03",status:"Pending HOD",hodNote:"",deanNote:""},
 {id:"APP-2026-006",student:"Kabir Sen",roll:"2401289007",branch:"CSE",type:"Internship NOC",purpose:"Full-time internship during semester break",submitted:"2026-09-29",status:"Dean Cleared",hodNote:"Department supports the internship window.",deanNote:"Cleared subject to academic calendar."}
];
state.applications=APPLICATIONS.map(x=>Object.assign({},x));
function applicationById(id){return state.applications.find(x=>x.id===id)}
function endorseApplication(id,decision){
 const a=applicationById(id); if(!a)return;
 if(state.role!=="hod"&&state.role!=="admin"){deny("hod");return}
 if(state.role==="hod"&&a.branch!==state.assignedBranch){toast("Branch scope enforced · CSE applications only");return}
 if(a.status!=="Pending HOD"){toast("Application is no longer awaiting HOD endorsement.");return}
 a.status=decision==="endorse"?"HOD Endorsed":"HOD Rejected";
 a.hodNote=decision==="endorse"?"Departmental review completed; endorsed for institutional clearance.":"Departmental review did not support this request.";
 render();toast(a.id+" · "+(decision==="endorse"?"endorsed":"rejected"));
}
function deanDecision(id,decision){
 const a=applicationById(id); if(!a)return;
 if(state.role!=="dean"&&state.role!=="admin"){deny("dean");return}
 if(a.status!=="HOD Endorsed"){toast("Only HOD-endorsed applications can enter final clearance.");return}
 a.status=decision==="clear"?"Dean Cleared":"Dean Rejected";
 a.deanNote=decision==="clear"?"Final institutional clearance granted.":"Final institutional clearance declined.";
 render();toast(a.id+" · "+(decision==="clear"?"cleared":"rejected"));
}
function applicationBadge(st){const cls=st.includes("Rejected")?"red":(st==="Dean Cleared"?"green":(st==="HOD Endorsed"?"blue":"amber"));return '<span class="tag '+cls+'">'+esc(st)+'</span>'}
function applicationRow(a,mode){
 const actions=mode==="hod"&&a.status==="Pending HOD"?'<div class="actions"><button class="primary" onclick="endorseApplication(\''+a.id+'\',\'endorse\')">Endorse</button><button class="danger" onclick="endorseApplication(\''+a.id+'\',\'reject\')">Reject</button></div>':mode==="dean"&&a.status==="HOD Endorsed"?'<div class="actions"><button class="primary" onclick="deanDecision(\''+a.id+'\',\'clear\')">Grant Clearance</button><button class="danger" onclick="deanDecision(\''+a.id+'\',\'reject\')">Reject</button></div>':'';
 return '<div class="list-row"><div><strong>'+esc(a.id)+' · '+esc(a.type)+'</strong><div class="meta">'+esc(a.student)+' · '+esc(a.roll)+' · '+esc(a.branch)+' · submitted '+esc(a.submitted)+'</div><div class="meta">Purpose: '+esc(a.purpose)+'</div>'+(a.hodNote?'<div class="meta">HOD note: '+esc(a.hodNote)+'</div>':'')+(a.deanNote?'<div class="meta">Dean note: '+esc(a.deanNote)+'</div>':'')+'</div><div>'+applicationBadge(a.status)+actions+'</div></div>';
}
function viewStudentApplicationHistory(regNo){const apps=getApplications().filter(a=>a.regNo===regNo),name=apps[0]?.studentName||regNo;openApplicationModal("Student Application History",`<p><strong>${escapeHtml(name)}</strong> · ${escapeHtml(regNo)}</p>${apps.length?apps.map(a=>`<div class="divider"><strong>${escapeHtml(a.id)}</strong> · ${escapeHtml(a.type)}<div class="meta">${escapeHtml(a.dates||"")} · ${escapeHtml(routeTargetLabel(a))} · ${escapeHtml((APPLICATION_STATUS[a.status]||{}).label||a.status)}</div><div class="meta">${escapeHtml(a.subject||a.reason||"")}</div></div>`).join(""):"<p>No prior applications.</p>"}`)}
function liveApplicationRow(a,mode){
  const actions=mode==="hod"
    ? `<div class="actions"><button class="primary" onclick="updateApplicationDecision('${a.id}','endorse')">Endorse &amp; Forward</button><button class="danger" onclick="rejectApplicationPrompt('${a.id}')">Reject</button></div>`
    : mode==="dean"
      ? `<div class="actions"><button class="primary" onclick="updateApplicationDecision('${a.id}','approve')">Grant Clearance</button><button class="danger" onclick="rejectApplicationPrompt('${a.id}')">Reject</button></div>`
      : "";
  const status=APPLICATION_STATUS[a.status]||{label:a.status,cls:""};
  return `<div class="list-row"><div><strong>${esc(a.id)} · ${esc(a.type)}</strong><div class="meta">${a.studentName?`<button class="app-mini-btn" type="button" onclick="viewStudentApplicationHistory(\'${a.regNo}\')">${esc(a.studentName)}</button>`:""} · ${esc(a.regNo)} · ${esc(a.branch)} · submitted ${esc(a.timestamp)}</div><div class="meta">Subject: ${esc(a.subject)}</div><div class="meta">Dates: ${esc(a.dates||"—")} · Attendance: ${esc(a.attendanceAtSubmission||"—")} · CGPA: ${esc(a.cgpa||"—")}</div></div><div><span class="tag ${status.cls||"blue"}">${esc(status.label)}</span>${actions}</div></div>`;
}
function hodTool(){
  const s=section("hod"),t=tab(s),branch=state.assignedBranch||"CSE";
  const legacy=state.applications.filter(a=>a.branch===branch);
  const live=getApplications().filter(a=>a.targetRole==="hod"&&a.targetDepartment===branch);
  if(t[0]==="hod-history"){
    const reviewed=legacy.filter(a=>a.status!=="Pending HOD").map(a=>applicationRow(a,"none")).join("");
    const liveReviewed=live.filter(a=>a.status!=="pending_hod").map(a=>liveApplicationRow(a,"none")).join("");
    return head(s,t)+card(`<div class="eyebrow">DEPARTMENTAL RECORD</div><h3>CSE Endorsement History</h3><p class="meta">Only CSE applications are visible to the HOD account.</p>${reviewed+liveReviewed||'<p class="meta">No reviewed CSE applications.</p>'}`);
  }
  const legacyQueue=legacy.filter(a=>a.status==="Pending HOD").map(a=>applicationRow(a,"hod")).join("");
  const liveQueue=live.filter(a=>a.status==="pending_hod").map(a=>liveApplicationRow(a,"hod")).join("");
  return head(s,t)+card(`<div class="eyebrow">CSE DEPARTMENT · ENDORSEMENT QUEUE</div><h3>Applications awaiting HOD review</h3><p class="meta">Branch scope: <strong>${esc(branch)}</strong>. Other departments are excluded before rendering.</p>${legacyQueue+liveQueue||'<p class="meta">No CSE applications are currently awaiting endorsement.</p>'}`);
}
function deanTool(){
  const s=section("dean"),t=tab(s);
  const legacyQueue=state.applications.filter(a=>a.status==="HOD Endorsed");
  const liveQueue=getApplications().filter(a=>a.status==="pending_dean");
  const legacyHistory=state.applications.filter(a=>a.status==="Dean Cleared"||a.status==="Dean Rejected");
  const liveHistory=getApplications().filter(a=>a.status==="approved"||a.status==="rejected");
  if(t[0]==="dean-history"){
    const history=legacyHistory.map(a=>applicationRow(a,"none")).join("")+liveHistory.map(a=>liveApplicationRow(a,"none")).join("");
    return head(s,t)+card(`<div class="eyebrow">INSTITUTIONAL RECORD</div><h3>Final Decision Register</h3><p class="meta">Institution-wide view across all departments, including direct Dean / Principal submissions.</p>${history||'<p class="meta">No final decisions recorded.</p>'}`);
  }
  const legacy=legacyQueue.map(a=>applicationRow(a,"dean")).join("");
  const live=liveQueue.map(a=>liveApplicationRow(a,"dean")).join("");
  return head(s,t)+card(`<div class="eyebrow">INSTITUTION-WIDE CLEARANCE</div><h3>Applications awaiting Dean / Principal clearance</h3><p class="meta">Includes HOD-endorsed applications and urgent applications routed directly to the Dean / Principal.</p>${legacy+live||'<p class="meta">No applications are awaiting final clearance.</p>'}`);
}

function renderMain(){document.body.classList.toggle("is-home",!!state.home);document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px");if(state.home){document.getElementById("main").innerHTML=homeView();return}if(!can(state.activeSection)){document.getElementById("main").innerHTML=restrictedView();return}const s=section(state.activeSection),t=tab(s);if(s.id==="academics")document.getElementById("main").innerHTML=academicsTool();else if(s.id==="hostel")document.getElementById("main").innerHTML=hostelTool();else if(s.id==="grievances")document.getElementById("main").innerHTML=grievanceTool();else if(s.id==="announcements")document.getElementById("main").innerHTML=announcementTool();else if(s.id==="warden")document.getElementById("main").innerHTML=wardenTool();else if(s.id==="gate")document.getElementById("main").innerHTML=gateTool();else if(s.id==="offgrid")document.getElementById("main").innerHTML=offgridTool();else if(s.id==="hod")document.getElementById("main").innerHTML=hodTool();else if(s.id==="dean")document.getElementById("main").innerHTML=deanTool();else document.getElementById("main").innerHTML=parentTool()}
function __campusRender(){const s=section(state.activeSection);if(!s.tabs.some(t=>t[0]===state.activeSubTab))state.activeSubTab=s.tabs[0][0];renderNav();renderMain();renderEditorialMenu();decorateLocks()}

function render(){__campusRender();if(state.activeSection==="academics"&&state.activeSubTab==="digital-clearance"&&state.role==="student"){renderStudentApplications();updateApplicationRouteUI()}}


document.addEventListener("DOMContentLoaded",()=>{try{render()}catch(e){console.error(e);document.getElementById("main").innerHTML='<section class="card"><h3>Render error caught</h3><div class="meta">Refresh to retry.</div></section>'}});

function academicClearanceQueueModule(role){
  const items=getApplicationsForRole(role);
  const title=role==="hod"?"HOD Command":"Dean / Principal Command";
  const subtitle=role==="hod"
    ?"CSE-scoped endorsement desk. Only applications routed to the CSE HOD are visible here."
    :"Institution-wide final clearance desk for applications forwarded by HODs or routed directly to Dean / Principal.";
  return `<div class="digital-clearance-shell">
    <section class="application-ledger-card">
      <h2>${title}</h2>
      <p class="subtle">${subtitle}</p>
      <div class="app-ledger">
        <div class="app-row app-row-head"><div>Application</div><div>Student / Request</div><div>Target</div><div>Submitted</div><div>Decision</div></div>
        ${items.length?items.map(a=>`
          <div class="app-row">
            <div class="app-cell"><span class="k">Application</span><div class="app-main">${escapeHtml(a.id)}</div><div class="app-meta">${escapeHtml(a.dates)}</div></div>
            <div class="app-cell"><span class="k">Student / Request</span><div class="app-main">${escapeHtml(a.studentName)} · ${escapeHtml(a.regNo)}</div><div class="app-meta">${escapeHtml(a.subject)}</div></div>
            <div class="app-cell"><span class="k">Target</span><div class="app-main">${escapeHtml(routeTargetLabel(a))}</div><div class="app-meta">${escapeHtml(a.type)}</div></div>
            <div class="app-cell"><span class="k">Submitted</span><div class="app-main">${escapeHtml(a.timestamp)}</div></div>
            <div class="app-cell"><span class="k">Decision</span><div class="app-row-actions">
              ${role==="hod"?`<button class="app-mini-btn" type="button" onclick="updateApplicationDecision('${a.id}','endorse')">Endorse & Forward</button>`:""}
              <button class="app-mini-btn" type="button" onclick="rejectApplicationPrompt('${a.id}')">Reject</button>
            </div></div>
          </div>`).join(""):`<div class="app-empty">No applications are currently awaiting ${role==="hod"?"HOD endorsement":"Dean / Principal clearance"}.</div>`}
      </div>
    </section>
  </div>`;
}
function deanDirectAndForwardedModule(){
  return academicClearanceQueueModule("dean");
}


document.addEventListener("click",function(e){
  const target=e.target.closest?.('[data-module="Digital Clearance & Applications"], [data-submodule="Digital Clearance & Applications"]');
  if(target && typeof state!=="undefined" && state.currentRole==="student"){
    setTimeout(()=>{renderStudentApplications();updateApplicationRouteUI()},0);
  }
});

</script>
