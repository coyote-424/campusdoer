.home{background:var(--bg-canvas);min-height:calc(100vh - var(--hh,112px));display:flex;flex-direction:column;position:relative;overflow:hidden}

function doLogin(e){
  if(e&&e.preventDefault)e.preventDefault();
  const c=AUTH_CREDENTIALS[lgRole]||{name:ROLES[lgRole]?.label||"User",role:lgRole,branch:"CSE"};
  const idEl=document.getElementById("lgId"),pwEl=document.getElementById("lgPass");
  const rawId=String(idEl?.value||"").trim(),rawPw=String(pwEl?.value||"").trim();
  const demoMode=(!rawId&&!rawPw)||(rawId.toLowerCase()==="admin"&&rawPw==="1234")||(!rawId||!rawPw);
  if(!demoMode){
    const id=normId(lgRole,rawId);
    if(normId(lgRole,c.id)!==id||c.pass!==rawPw){
      const er=document.getElementById("lgErr");
      if(er){er.textContent="Invalid credentials for selected role.";er.style.display="block"}
      if(pwEl){pwEl.value="";pwEl.focus()}
      return false;
    }
  }
  const rem=document.getElementById("lgRem");
  if(rem&&rem.checked)storageSet("cd_session",JSON.stringify({role:lgRole}));
  else storageRemove("cd_session");
  Store.currentUser={...Store.currentUser,role:lgRole,name:c.name,regNo:Store.currentUser.regNo||AUTH_CREDENTIALS.student.id,branch:c.branch||Store.currentUser.branch||"CSE"};
  Store.ui.wardenUnlocked=lgRole==="warden"||lgRole==="admin";
  Store.ui.isParentLoggedIn=lgRole==="parent"||lgRole==="admin";
  Store.ui.parentPhone=lgRole==="parent"?(normId(lgRole,rawId)||normId(lgRole,c.id)):Store.ui.parentPhone;
  if(lgRole==="parent"||lgRole==="admin")Store.ui.parentRoll=Store.currentUser.regNo;
  if(lgRole==="hod")Store.currentUser.branch=c.branch||"CSE";
  if(!can(Store.ui.activeSection)){
    const allowed=visibleSections();
    if(allowed.length>0){
      Store.ui.activeSection=allowed[0].id;
      Store.ui.activeSubTab=allowed[0].tabs[0][0];
    }
  }
  Store.ui.home=false;
  Store.ui.menuOpen=false;
  closeRoles();
  persistStore();
  render();
  toast("Authenticated as "+c.name);
  return false;
}

function submitStudentApplication(){if(Store.currentUser.role!=="student"){toast("Student login is required.");return}const f=document.getElementById("studentApplicationForm");if(!f)return;const type=f.applicationType.value,route=f.applicationRoute.value,dept=route==="hod"?f.applicationDepartment.value:null,subject=f.subject.value.trim(),dates=f.dateText.value.trim(),reason=f.reason.value.trim();if(!type||!subject||!dates||!reason){toast("Complete Type, Subject, Dates and Reason.");return}const me=currentStudentIdentity(),app={id:nextApplicationId(),studentName:me.name,regNo:me.regNo,branch:me.branch,targetRole:route,targetDepartment:dept,type,subject,dates,reason,status:route==="hod"?"pending_hod":"pending_dean",submittedAt:new Date().toLocaleString("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:true}),rejectionReason:null,eSignHash:null,approvedOd:false};Store.applications.unshift(app);persistStore();f.reset();updateApplicationRouteUI();render();toast(app.id+" submitted to "+routeLabel(app)+".")}
function renderStudentApplications(){const host=document.getElementById("studentApplicationsPanel");if(!host)return;const me=currentStudentIdentity(),apps=Store.applications.filter(a=>a.regNo===me.regNo);const rows=apps.map(a=>{const st=applicationStatus(a);let action="";if(a.status==="approved")action='<button class="app-mini-btn" type="button" onclick="viewApplicationStamp(\''+a.id+'\')">View E-Sign</button>';else if(a.status==="rejected")action='<button class="app-mini-btn" type="button" onclick="viewApplicationRejection(\''+a.id+'\')">Reason</button>';return '<div class="app-row"><div><span class="k">ID</span><strong>'+esc(a.id)+'</strong></div><div><span class="k">Type</span>'+esc(a.type)+'<div class="app-meta">'+esc(a.subject)+'</div></div><div><span class="k">Target</span>'+esc(routeLabel(a))+'</div><div><span class="k">Status</span><span class="app-status '+st.cls+'">'+esc(st.label)+'</span></div><div>'+action+'</div></div>'}).join("");host.innerHTML='<div class="application-ledger-card"><h2>Live Application Tracker</h2><p class="subtle">Student → HOD → Dean / Principal clearance pipeline.</p><div class="app-ledger"><div class="app-row app-row-head"><div>ID</div><div>Type</div><div>Target</div><div>Status</div><div>Action</div></div>'+(rows||'<div class="app-empty">No applications submitted yet.</div>')+'</div></div>'}
function studentApplicationsModule(){return '<div class="digital-clearance-shell"><section class="application-form-card"><div class="eyebrow">STUDENT DIGITAL APPLICATION DESK</div><h2>Clearance &amp; Applications</h2><p class="subtle">Short-form digital routing into the academic clearance chain.</p><form id="studentApplicationForm" onsubmit="event.preventDefault();submitStudentApplication()"><div class="app-form-grid"><div class="app-field"><label>Route To<select id="applicationRoute" name="applicationRoute" onchange="updateApplicationRouteUI()"><option value="hod">Head of Department (HOD)</option><option value="dean">Dean / Principal</option></select></label></div><div id="applicationDepartmentWrap" class="app-field"><label>Branch<select id="applicationDepartment" name="applicationDepartment"><option>CSE</option><option>ETC</option><option>EEE</option><option>MECH</option><option>CIVIL</option></select></label></div><div class="app-field"><label>Application Type<select name="applicationType"><option>OD Attendance Claim (Hackathon/Event)</option><option>Bonafide Certificate</option><option>Clearance NOC</option></select></label></div><div class="app-field"><label>Subject<input name="subject" placeholder="Application subject" required></label></div><div class="app-field"><label>Date duration<input name="dateText" placeholder="Oct 10-12, 2026" required></label></div><div class="app-field full"><label>Reason<textarea name="reason" rows="3" placeholder="Reason / justification" required></textarea></label></div><div class="app-field full"><button type="button" class="app-mini-btn" onclick="fillDemoODRequest()">Fill Demo OD Request</button></div></div><div class="app-submit-row"><span class="app-route-help">Digital endorsement routing is persisted in this browser.</span><button class="app-submit-btn" type="submit">Submit for Digital Endorsement</button></div></form></section><div id="studentApplicationsPanel"></div></div>'}
function viewApplicationStamp(id){const a=Store.applications.find(x=>x.id===id);if(!a)return;openApplicationModal("Digital Approval",'<div class="app-stamp"><strong>APPROVED &amp; E-SIGNED</strong><p><code>'+esc(a.eSignHash||"DS-BPUT-2026-OK")+'</code></p><p>'+esc(a.id)+' · '+esc(a.studentName)+'</p></div>')}
function viewApplicationRejection(id){const a=Store.applications.find(x=>x.id===id);if(!a)return;openApplicationModal("Application Rejected",'<p>'+esc(a.rejectionReason||"No rejection reason recorded.")+'</p>')}
function openApplicationModal(title,body){document.getElementById("applicationModal")?.remove();const el=document.createElement("div");el.id="applicationModal";el.className="app-modal-backdrop";el.innerHTML='<div class="app-modal"><h3>'+esc(title)+'</h3>'+body+'<div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="app-mini-btn" type="button" onclick="document.getElementById(\'applicationModal\')?.remove()">Close</button></div></div>';el.addEventListener("click",e=>{if(e.target===el)el.remove()});document.body.appendChild(el)}
function viewStudentApplicationHistory(regNo){const apps=Store.applications.filter(a=>a.regNo===regNo),name=apps[0]?.studentName||regNo;openApplicationModal("Student Application History",'<p><strong>'+esc(name)+'</strong> · '+esc(regNo)+'</p>'+(apps.length?apps.map(a=>{const st=applicationStatus(a);return '<div class="history-item"><strong>'+esc(a.id)+'</strong> · '+esc(a.type)+'<div class="meta">'+esc(a.dates)+' · '+esc(routeLabel(a))+' · '+esc(st.label)+'</div><div class="meta">'+esc(a.reason)+'</div></div>'}).join(""): '<p>No prior applications.</p>'))}
function rejectLiveApplication(id){const a=Store.applications.find(x=>x.id===id);if(!a)return;const reason=prompt("Rejection reason:","Insufficient documentation for clearance.");if(reason===null)return;a.status="rejected";a.rejectionReason=reason.trim()||"Request not supported by the reviewing authority.";a.rejectedAt=new Date().toISOString();persistStore();render();toast(a.id+" rejected.")}
function endorseLiveApplication(id){if(Store.currentUser.role!=="hod"&&Store.currentUser.role!=="admin"){deny("hod");return}const a=Store.applications.find(x=>x.id===id);if(!a||a.status!=="pending_hod"){toast("Application is not awaiting HOD endorsement.");return}if(Store.currentUser.role==="hod"&&a.targetDepartment!==Store.currentUser.branch){toast("Branch scope enforced · "+Store.currentUser.branch+" only.");return}a.status="pending_dean";a.hodEndorsedAt=new Date().toISOString();persistStore();render();toast(a.id+" endorsed · forwarded to Dean.")}
function approveLiveApplication(id){if(Store.currentUser.role!=="dean"&&Store.currentUser.role!=="admin"){deny("dean");return}const a=Store.applications.find(x=>x.id===id);if(!a||a.status!=="pending_dean"){toast("Application is not awaiting Dean clearance.");return}a.status="approved";a.approvedOd=/OD Attendance Claim/i.test(a.type);a.eSignHash="DS-BPUT-2026-OK";a.approvedAt=new Date().toISOString();if(a.approvedOd&&!a.odCreditApplied){if(a.regNo===Store.currentUser.regNo){Store.currentUser.attendance.odBonus+=4}else{Store.currentUser.attendance=Store.currentUser.attendance||{baseAtt:117,baseTot:147,odBonus:0};Store.currentUser.attendance.odBonus+=4}a.odCreditApplied=true}persistStore();render();toast(a.id+" approved · E-Sign applied"+(a.approvedOd?" · +4 lectures credited.":"."))}

const WORKERS=[
 {id:"w1",name:"Ramesh Kumar",role:"Senior Plumber",phone:"+91 98610 23411",trades:["Plumbing"]},
 {id:"w2",name:"Bikash Jena",role:"Electrician",phone:"+91 94370 88219",trades:["Electrical"]},
 {id:"w3",name:"Sunil Mohanty",role:"Carpenter",phone:"+91 99370 45102",trades:["Classroom Furniture"]},
 {id:"w4",name:"Debashish Rout",role:"IT Helpdesk Technician",phone:"+91 90400 11872",trades:["Campus Wi-Fi / Labs"]},
 {id:"w5",name:"Lata Behera",role:"Mess Supervisor",phone:"+91 93480 66721",trades:["Canteen Hygiene"]},
 {id:"w6",name:"Suresh Nayak",role:"Warden on Duty",phone:"+91 94370 55028",trades:["Ragging / Noise","Others"]}];
const LOC={"TKT-2401":"Hostel B, Wing 2, Rm 214","TKT-2398":"Hostel C, Rm 118","TKT-2387":"Hostel B, Wing 1, Rm 108","TKT-2379":"Lab-2, Academic Block"};
function worker(id){return WORKERS.find(w=>w.id===id)||WORKERS[5]}
function autoWorker(cat){return(WORKERS.find(w=>w.trades.includes(cat))||WORKERS[5]).id}
function tloc(x){return x.location||LOC[x.id]||"Hostel B, Rm 214"}
function elapsed(x){return Math.max(0,((x.resolvedAt||Date.now())-x.assignedAt)/36e5)}
function hrs(x){return elapsed(x)}
function assignee(x){const w=worker(x.workerId||autoWorker(x.category));return w.name+" · "+w.role}
function elapsedHtml(x){const h=elapsed(x),old=h>4&&x.status!=="Resolved";return '<span class="elapsed tag '+(old?"red":"")+'" data-t="'+x.id+'">'+h.toFixed(1)+' hrs Elapsed'+(old?' · SLA BREACH':'')+'</span>'}
Store.tickets.forEach(x=>{if(!x.workerId)x.workerId=autoWorker(x.category);if(!x.assignedAt)x.assignedAt=Date.now();if(x.status==="Resolved"&&!x.resolvedAt)x.resolvedAt=x.assignedAt+3*36e5});persistStore();
function setTicketStatus(i,st){const x=Store.tickets[i];if(!x)return;x.status=st;x.resolvedAt=st==="Resolved"?Date.now():null;persistStore();render();toast(x.id+" marked "+st+".")}
function reassignTicket(i){openDispatch(i)}
let dispIdx=-1;
function openDispatch(i){const x=Store.tickets[i];if(!x)return;dispIdx=i;const w=worker(x.workerId||autoWorker(x.category)),m=document.getElementById("dispModal");m.style.display="flex";
 m.innerHTML='<div class="rm-box"><div class="rm-top"><div><div class="rm-k">'+esc(x.id)+' · '+esc(x.category)+'</div><h2>Assign / Dispatch Worker</h2></div><button class="menu-close" onclick="closeDispatch()" aria-label="Close">✕</button></div><div class="form"><label class="field full">Worker<select id="dWorker">'+WORKERS.map(k=>'<option value="'+k.id+'"'+(k.id===w.id?" selected":"")+'>'+esc(k.name+" · "+k.role+" · "+k.phone)+'</option>').join("")+'</select></label><label class="field">Priority<select id="dPrio"><option>HIGH</option><option selected>MEDIUM</option><option>LOW</option></select></label><div class="field"><span class="meta">Location</span><div>'+esc(tloc(x))+'</div></div><label class="field full">Custom instructions<textarea id="dNote">'+esc(x.title)+'</textarea></label><div class="full"><button class="primary" onclick="dispatchSms()">Dispatch SMS to Worker</button></div></div></div>'}
function closeDispatch(){document.getElementById("dispModal").style.display="none"}
function dispatchSms(){const x=Store.tickets[dispIdx];if(!x)return;const w=worker(document.getElementById("dWorker").value),pr=document.getElementById("dPrio").value,note=document.getElementById("dNote").value.trim()||x.title;
 x.workerId=w.id;x.assignedAt=Date.now();x.resolvedAt=null;x.status="Dispatched";x.priority=pr;
 Store.smsLog.unshift({to:w.phone,who:w.name+" · "+w.role,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),text:"TASK ALERT: Report immediately to "+tloc(x)+" for "+note+". Ticket: "+x.id+". Priority: "+pr+". Reply DONE "+x.id+" once fixed."});
 persistStore();closeDispatch();render();toast("SMS DISPATCHED → "+w.phone+": TASK ALERT sent to "+w.name+" for "+tloc(x)+". Priority: "+pr+".")}
function rosterView(s,t){return head(s,t)+card('<h3>Worker Duty Roster &amp; SLA Telemetry</h3><table><thead><tr><th>Issue</th><th>Assigned Worker</th><th>Location</th><th>Elapsed (SLA)</th><th>Status</th><th>Action</th></tr></thead><tbody>'+Store.tickets.map((x,i)=>{const w=worker(x.workerId||autoWorker(x.category));return '<tr><td>'+esc(x.id)+' · '+esc(x.category)+'</td><td>'+esc(w.name)+' · '+esc(w.role)+'<div class="meta">'+esc(w.phone)+'</div></td><td>'+esc(tloc(x))+'</td><td>'+elapsedHtml(x)+'</td><td><span class="tag '+(x.status==="Resolved"?"green":x.status==="Logged"?"":"amber")+'">'+esc(x.status)+'</span></td><td>'+(x.status==="Resolved"?"—":'<button class="ghost" onclick="openDispatch('+i+')">Assign / Reassign</button>')+'</td></tr>'}).join("")+'</tbody></table>')+card('<h3>Simulated Outbound Worker SMS</h3>'+(Store.smsLog.length?Store.smsLog.map(m=>'<div class="terminal" style="margin-bottom:10px">[DISPATCH SMS SENT TO: '+esc(m.to)+' ('+esc(m.who)+')] · '+esc(m.time)+'\n"'+esc(m.text)+'"</div>').join(""):'<div class="empty">No dispatch SMS sent yet. Use Assign / Reassign to alert a worker.</div>'))}
setInterval(()=>{document.querySelectorAll(".elapsed").forEach(el=>{const x=Store.tickets.find(t=>t.id===el.dataset.t);if(!x)return;const h=elapsed(x),old=h>4&&x.status!=="Resolved";el.textContent=h.toFixed(1)+" hrs Elapsed"+(old?" · SLA BREACH":"");el.classList.toggle("red",old)})},10000);
const METRICS=[["79.6%","BPUT Attendance Pulse","Active threshold guard"],["0.00s","Gate Clearance Delay","Offline OTP/QR authentication"],["1.2 MB","Cached PWA Footprint","2G / Low-Bandwidth ready"],["1-Tap","Nightly Dinner Opt-Out","Zero mess waste"]];
function homeView(){return '<div class="home"><section class="hero"><div class="hero-in"><div class="hk">CAMPUS OPERATIONS // ARCHITECTURE STANDARD</div><h1 class="hh">Campus Doer</h1><p class="hs">An offline-first operational standard connecting students, residential wardens, security checkpoints, and guardians across campus institutions.</p><div class="ha"><button class="hb hb-solid" onclick="openDirectory()">EXPLORE SYSTEM DIRECTORY</button>'+(can("offgrid")?'<button class="hb hb-line" onclick="jumpOffgrid()">OFF-GRID SIMULATOR</button>':'')+'</div></div></section><section class="hm">'+METRICS.map(m=>'<div><b>'+m[0]+'</b><span>'+m[1]+'</span><small>'+m[2]+'</small></div>').join("")+'</section></div>'}
function goHome(){Store.ui.home=true;Store.ui.menuOpen=false;render();window.scrollTo(0,0)}
function openDirectory(){Store.ui.menuOpen=true;render()}
function jumpOffgrid(){if(!can("offgrid")){deny("offgrid");return}Store.ui.activeSection="offgrid";Store.ui.activeSubTab="terminal";Store.ui.menuOpen=false;Store.ui.home=false;render();window.scrollTo(0,0)}
function liveQueueRow(a,mode){const st=applicationStatus(a);let actions="";if(mode==="hod"&&a.status==="pending_hod")actions='<div class="actions"><button class="primary" type="button" onclick="endorseLiveApplication(\''+a.id+'\')">Endorse</button><button class="danger" type="button" onclick="rejectLiveApplication(\''+a.id+'\')">Reject</button></div>';if(mode==="dean"&&a.status==="pending_dean")actions='<div class="actions"><button class="primary" type="button" onclick="approveLiveApplication(\''+a.id+'\')">Grant E-Sign Approval</button><button class="danger" type="button" onclick="rejectLiveApplication(\''+a.id+'\')">Reject</button></div>';return '<div class="list-row"><div><strong><button class="student-link" type="button" onclick="viewStudentApplicationHistory(\''+a.regNo+'\')">'+esc(a.studentName)+'</button> · '+esc(a.id)+'</strong><div class="meta">'+esc(a.type)+' · '+esc(a.branch)+' · '+esc(a.dates)+'</div><div class="meta">Subject: '+esc(a.subject)+' · Target: '+esc(routeLabel(a))+'</div></div><div><span class="tag '+st.cls+'">'+esc(st.label)+'</span>'+actions+'</div></div>'}
function deanTelemetry(a){const approved=Store.applications.filter(x=>x.regNo===a.regNo&&x.status==="approved"&&x.approvedOd).length;const pct=attendanceStats().pct.toFixed(1);return '<div class="app-telemetry"><div><span>Attendance</span><strong>'+pct+'%</strong><small>BPUT cutoff 75%</small></div><div><span>Approved OD leaves</span><strong>'+approved+'</strong><small>This semester</small></div></div>'}
function hodTool(){const s=section("hod"),t=tab(s),branch=Store.currentUser.branch||"CSE",live=Store.applications.filter(a=>a.targetRole==="hod"&&a.targetDepartment===branch);if(t[0]==="hod-history"){const rows=live.filter(a=>a.status!=="pending_hod").map(a=>liveQueueRow(a,"history")).join("");return head(s,t)+card('<div class="eyebrow">DEPARTMENTAL RECORD</div><h3>'+esc(branch)+' Endorsement History</h3><p class="meta">Click a student name to open their application history.</p>'+(rows||'<p class="meta">No reviewed '+esc(branch)+' applications.</p>'))}const rows=live.filter(a=>a.status==="pending_hod").map(a=>liveQueueRow(a,"hod")).join("");return head(s,t)+card('<div class="eyebrow">'+esc(branch)+' DEPARTMENT · ENDORSEMENT QUEUE</div><h3>Applications awaiting HOD review</h3><p class="meta">Branch scope is enforced to <strong>'+esc(branch)+'</strong>.</p>'+(rows||'<p class="meta">No applications are currently awaiting endorsement.</p>'))}
function deanTool(){const s=section("dean"),t=tab(s),queue=Store.applications.filter(a=>a.status==="pending_dean"),history=Store.applications.filter(a=>a.status==="approved"||a.status==="rejected");if(t[0]==="dean-history"){const rows=history.map(a=>liveQueueRow(a,"history")).join("");return head(s,t)+card('<div class="eyebrow">INSTITUTIONAL RECORD</div><h3>Final Decision Register</h3>'+(rows||'<p class="meta">No final decisions recorded.</p>'))}const first=queue[0];const rows=queue.map(a=>liveQueueRow(a,"dean")).join("");return head(s,t)+card('<div class="eyebrow">INSTITUTION-WIDE CLEARANCE</div><h3>Dean / Principal Command Desk</h3><p class="meta">Endorsed HOD applications and direct institutional requests. Academic marks are intentionally hidden.</p>'+ (first?deanTelemetry(first):'') + (rows||'<p class="meta">No applications are awaiting final clearance.</p>'))}

function renderMain(){document.body.classList.toggle("is-home",!!Store.ui.home);document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+"px");if(Store.ui.home){document.getElementById("main").innerHTML=homeView();return}if(!can(Store.ui.activeSection)){document.getElementById("main").innerHTML=restrictedView();return}const s=section(Store.ui.activeSection),t=tab(s);if(s.id==="academics")document.getElementById("main").innerHTML=academicsTool();else if(s.id==="hostel")document.getElementById("main").innerHTML=hostelTool();else if(s.id==="grievances")document.getElementById("main").innerHTML=grievanceTool();else if(s.id==="announcements")document.getElementById("main").innerHTML=announcementTool();else if(s.id==="warden")document.getElementById("main").innerHTML=wardenTool();else if(s.id==="gate")document.getElementById("main").innerHTML=gateTool();else if(s.id==="offgrid")document.getElementById("main").innerHTML=offgridTool();else if(s.id==="hod")document.getElementById("main").innerHTML=hodTool();else if(s.id==="dean")document.getElementById("main").innerHTML=deanTool();else document.getElementById("main").innerHTML=parentTool()}
function render(){const s=section(Store.ui.activeSection);if(!s.tabs.some(t=>t[0]===Store.ui.activeSubTab))Store.ui.activeSubTab=s.tabs[0][0];renderNav();renderMain();renderEditorialMenu();decorateLocks();if(Store.ui.activeSection==="academics"&&Store.ui.activeSubTab==="clearance"&&Store.currentUser.role==="student"){renderStudentApplications();updateApplicationRouteUI()}}
document.addEventListener("DOMContentLoaded",()=>{try{render()}catch(e){console.error(e);document.getElementById("main").innerHTML='<section class="card"><h3>Render error caught</h3><div class="meta">Refresh to retry.</div></section>'}});
</script>
