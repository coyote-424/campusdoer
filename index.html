<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campus Doer</title>
<style>
:root{
  --bg:#0B0F19; --surface:#131826cc; --surface2:#161C2C; --line:#232A3D; --line2:#2E3650;
  --ink:#E7EAF3; --muted:#94A3B8; --accent:#14B8A6; --accent2:#2DD4BF;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{--bg:#F8FAFC;--surface:#FFFFFFcc;--surface2:#FFFFFF;--line:#E2E8F0;--line2:#CBD5E1;--ink:#0F172A;--muted:#64748B;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:
  radial-gradient(1100px 500px at 10% -10%, #14B8A622, transparent 60%),
  radial-gradient(900px 500px at 100% 0%, #10B98115, transparent 60%),
  var(--bg);
  color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  letter-spacing:-.01em; min-height:100%;
}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--surface);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#8B5CF6);
  display:flex;align-items:center;justify-content:center;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:700}
.brand p{margin:0;font-size:11px;color:var(--muted)}
.livepill{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ok);
  background:#10B98118;border:1px solid #10B98140;padding:5px 10px;border-radius:20px}
.livepill.off{color:var(--bad);background:#EF444418;border-color:#EF444440}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 18px;background:var(--surface2);
  border-bottom:1px solid var(--line); scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid transparent;background:transparent;color:var(--muted);
  padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
nav button:hover{color:var(--ink)}
nav button.active{background:var(--accent);color:#fff}
main{max-width:880px;margin:0 auto;padding:20px 18px 60px}
.card{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--line);
  border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px -12px #00000066}
.card h2{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3{margin:16px 0 8px;font-size:11.5px;color:var(--muted);text-transform:none;font-weight:600}
label{display:block;font-size:11.5px;color:var(--muted);margin:9px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line2);border-radius:9px;
  background:var(--surface2);color:var(--ink);font-size:13px;font-family:inherit;outline:none;
  transition:box-shadow .15s,border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #14B8A633}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
button.primary{background:linear-gradient(135deg,var(--accent),#2DD4BF);color:#fff;border:none;
  padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;
  box-shadow:0 4px 14px -4px #14B8A677;transition:transform .1s}
button.primary:hover{transform:translateY(-1px)}
button.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);padding:6px 12px;
  border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
button.ghost:hover{border-color:var(--accent)}
button.danger{background:#EF444422;border:1px solid #EF444455;color:#FCA5A5;padding:7px 13px;
  border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.item{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item:first-child{border-top:none}
.meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 9px;
  border-radius:20px;background:var(--line);color:var(--muted)}
.pill.ok{background:#10B98122;color:var(--ok)}
.pill.warn{background:#F59E0B22;color:var(--warn)}
.pill.bad{background:#EF444422;color:var(--bad)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.metric{border:1px solid var(--line);border-radius:11px;padding:12px;background:var(--surface2)}
.metric b{display:block;font-size:22px;font-weight:800}
.metric span{font-size:11px;color:var(--muted)}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.qr{width:88px;height:88px;border-radius:8px;flex:none;
  background:
   repeating-linear-gradient(0deg, var(--ink) 0 4px, transparent 4px 8px),
   repeating-linear-gradient(90deg, var(--ink) 0 4px, transparent 4px 8px);
  background-blend-mode:multiply; opacity:.85; border:1px solid var(--line2)}
.term{background:#080B12;color:#6EE7B7;font-family:ui-monospace,Menlo,Consolas,monospace;border-radius:11px;
  padding:14px;font-size:12.5px;min-height:140px;white-space:pre-wrap;border:1px solid var(--line2)}
.termline{opacity:.92;margin-bottom:5px;line-height:1.5}
small.hint{color:var(--muted);display:block;margin-top:6px}
.alertcard{border-color:#F59E0B55;background:linear-gradient(135deg,#F59E0B14,var(--surface))}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 10px 30px -10px #000a}
.toast.show{opacity:1}
.rateBtns button{padding:5px 10px;font-size:11px;margin-right:5px}
.themebtn{border:1px solid var(--line2);background:transparent;color:var(--muted);width:30px;height:30px;
  border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
    <div><h1>Campus Doer</h1><p>Frictionless University Operations Engine &amp; Off-Grid Gateway</p></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="livepill" id="livePill"><span class="dot"></span> Live Gateway Active</span>
    <button class="themebtn" onclick="toggleTheme()" title="Toggle theme">◐</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const state = {
  role:'student', offline:false,
  tickets:[
    {id:'T-101',cat:'Plumbing',loc:'Hostel B, Wing 2, Rm 214',urgency:'High',status:'In Progress',assignee:'Ramesh · Plumber',age:20},
    {id:'T-102',cat:'Plumbing',loc:'Hostel B, Wing 2, Rm 208',urgency:'Medium',status:'Dispatched',assignee:'Ramesh · Plumber',age:30},
    {id:'T-103',cat:'Electrical',loc:'Hostel C, Rm 118',urgency:'High',status:'Logged',assignee:'Unassigned',age:52},
  ],
  passes:[], passSeq:1041,
  notices:[{tag:'3rd Yr · CSE',text:'Mid-sem lab schedule released — check timetable.'},
           {tag:'Hostel B',text:'Water tanker maintenance tomorrow 6–8 AM.'}],
  timetable:[{t:'9:00',s:'Data Structures',h:'LH-3',st:'Attended'},{t:'11:00',s:'Digital Logic',h:'LH-1',st:'Attended'},
             {t:'2:00',s:'DBMS Lab',h:'Lab-2',st:'Upcoming'}],
  attendance:71, mess:{Good:14,OK:5,Poor:2},
};

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function ageTag(a){return a>48?'bad':a>24?'warn':'ok';}
function statusTag(s){return ['Resolved','Approved','Checked Out'].includes(s)?'ok':(s==='Rejected'?'bad':'warn');}
function setRole(r){state.role=r; render();}
function toggleTheme(){
  const html=document.documentElement;
  html.setAttribute('data-theme', html.getAttribute('data-theme')==='light'?'dark':'light');
}
function toggleOffline(){
  state.offline=!state.offline;
  const p=document.getElementById('livePill');
  p.className='livepill'+(state.offline?' off':'');
  p.innerHTML=`<span class="dot"></span> ${state.offline?'Offline Mesh Mode':'Live Gateway Active'}`;
  toast(state.offline?'Switched to offline / 2G simulation — actions will queue':'Back online — queued actions synced');
}

function submitPass(dest,dep,ret,reason){
  const id='GP-'+(state.passSeq++);
  state.passes.unshift({id,dest,dep,ret,reason,status:'Pending',otp:null,qr:false,student:'Anika Rao · Rm 214B'});
  toast((state.offline?'Queued offline — ':'')+'Gate pass '+id+' submitted for approval');
  render();
}
function approvePass(id){const p=state.passes.find(p=>p.id===id);p.status='Approved';p.otp=String(Math.floor(1000+Math.random()*9000));p.qr=true;toast(id+' approved — OTP generated');render();}
function rejectPass(id){const p=state.passes.find(p=>p.id===id);p.status='Rejected';toast(id+' rejected');render();}
function rateMess(k){state.mess[k]++;toast('Thanks for rating today\'s menu: '+k);render();}
function importCsv(){toast('Simulated: 214 student records migrated from legacy ERP');}

function verifyOtp(code){
  const p=state.passes.find(p=>p.otp===code && p.status==='Approved');
  const out=document.getElementById('guardResult');
  if(p){
    p.status='Checked Out';
    out.innerHTML=`<div class="card" style="margin-top:10px;border-color:#10B98155">
      <span class="pill ok">● Authorized Departure</span>
      <p style="margin:10px 0 2px;font-size:14px;font-weight:700">${p.student}</p>
      <p class="meta">Destination: ${p.dest} · Return: ${p.ret}<br>Checkout: ${new Date().toLocaleTimeString()} · ${p.id}</p></div>`;
    toast('Gate log recorded for '+p.id); render();
  } else {
    out.innerHTML=`<div class="card" style="margin-top:10px;border-color:#EF444455">
      <span class="pill bad">● Invalid / Unapproved</span>
      <p class="meta" style="margin-top:8px">No approved pass matches that code.</p></div>`;
  }
}
function runSms(){
  const inp=document.getElementById('smsIn'); const cmd=inp.value.trim(); if(!cmd) return;
  const log=document.getElementById('smsLog');
  const line=(t)=>{const d=document.createElement('div');d.className='termline';d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;};
  line('> '+cmd); inp.value='';
  const parts=cmd.split(/\s+/);
  if(parts[0]==='GATE' && parts[1]==='LEAVE' && parts.length>=5){
    const [,,dep,ret,...destArr]=parts, dest=destArr.join(' ');
    submitPass(dest,dep,ret,'SMS fallback request');
    line('SMS CONFIRM: Gate pass GP-'+(state.passSeq-1)+' queued for warden approval. Reply STATUS '+(state.passSeq-1)+' to check.');
  } else if(parts[0]==='STATUS' && parts[1]){
    const p=state.passes.find(x=>x.id.includes(parts[1]))||state.passes[0];
    line(p?`SMS: ${p.id} is ${p.status}${p.otp?(' · OTP '+p.otp):''}`:'SMS: No matching request found.');
  } else {
    line('SYNTAX ERROR. Try: GATE LEAVE 2026-10-02 2026-10-04 HOME');
  }
}
function ring(pct,color){
  const r=36,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="ring"><svg width="86" height="86"><circle cx="43" cy="43" r="${r}" stroke="var(--line2)" stroke-width="8" fill="none"/>
    <circle cx="43" cy="43" r="${r}" stroke="${color}" stroke-width="8" fill="none" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg><div class="val">${pct}%</div></div>`;
}

function studentView(){
  return `
  <div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    ${ring(state.attendance, state.attendance<75?'var(--bad)':'var(--ok)')}
    <div><h2 style="margin:0">Attendance</h2>
    <p class="meta" style="margin-top:4px">${state.attendance<75?'Below the 75% BPUT threshold — attend upcoming classes.':'Comfortably above the 75% threshold.'}</p></div>
  </div>
  <div class="card"><h2>Today's Timetable</h2>
    ${state.timetable.map(x=>`<div class="item"><div><b>${x.t}</b> — ${x.s}<div class="meta">${x.h}</div></div><span class="pill ${x.st==='Attended'?'ok':'warn'}">${x.st}</span></div>`).join('')}
  </div>
  <div class="card">
    <h2>Log a Maintenance Issue</h2>
    <div class="row">
      <div><label>Category</label><select id="mCat"><option>Plumbing</option><option>Electrical</option><option>Hostel Room</option><option>Mess</option></select></div>
      <div><label>Urgency</label><select id="mUrg"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
    </div>
    <label>Description</label><textarea id="mDesc" rows="2" placeholder="e.g. Leaking tap in washroom"></textarea>
    <label>Attachment</label><input type="file" disabled style="opacity:.5"> <small class="hint">Photo/voice preview (simulated)</small>
    <button class="primary" onclick="(function(){
      const c=document.getElementById('mCat').value,u=document.getElementById('mUrg').value;
      state.tickets.unshift({id:'T-'+(100+state.tickets.length+1),cat:c,loc:'Hostel B, Rm 214',urgency:u,status:'Logged',assignee:'Unassigned',age:0});
      toast('Complaint logged'); render();
    })()">Submit Complaint</button>
    <h3>Your Tickets</h3>
    ${state.tickets.slice(0,3).map(t=>`<div class="item"><div><b>${t.cat}</b><div class="meta">${t.loc}</div></div><span class="pill ${statusTag(t.status)}">${t.status}</span></div>`).join('')}
  </div>
  <div class="card">
    <h2>Gate Pass / Leave</h2>
    <div class="row"><div><label>Destination</label><input id="pDest" placeholder="HOME"></div><div><label>Reason</label><input id="pReason" placeholder="Weekend visit"></div></div>
    <div class="row"><div><label>Departure</label><input id="pDep" type="date"></div><div><label>Return</label><input id="pRet" type="date"></div></div>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" checked style="width:auto">Notify parent by SMS</label>
    <button class="primary" onclick="submitPass(document.getElementById('pDest').value||'HOME',document.getElementById('pDep').value||'—',document.getElementById('pRet').value||'—',document.getElementById('pReason').value||'—')">Request Gate Pass</button>
    <h3>Pass Ledger</h3>
    ${state.passes.length?state.passes.map(p=>`
      <div class="item"><div><b>${p.id}</b> → ${p.dest}<div class="meta">${p.dep} to ${p.ret}</div>${p.otp?`<div class="meta">Emergency OTP: <b style="color:var(--ink)">${p.otp}</b></div>`:''}</div>
      <div style="text-align:right">${p.qr?'<div class="qr" style="margin-left:auto"></div>':''}<span class="pill ${statusTag(p.status)}">${p.status}</span></div></div>`).join(''):'<p class="meta">No requests yet.</p>'}
  </div>
  <div class="card">
    <h2>Notices &amp; Mess</h2>
    ${state.notices.map(n=>`<div class="item"><div><span class="pill">${n.tag}</span><p style="margin:6px 0 0;font-size:13px">${n.text}</p></div></div>`).join('')}
    <h3>Today's Mess Menu</h3>
    <p style="font-size:13px;margin:0 0 8px">Lunch: Rice, Dal, Aloo Gobi, Curd · Dinner: Roti, Paneer Curry, Salad</p>
    <div class="rateBtns"><button class="ghost" onclick="rateMess('Good')">🙂 Good (${state.mess.Good})</button>
      <button class="ghost" onclick="rateMess('OK')">😐 OK (${state.mess.OK})</button>
      <button class="ghost" onclick="rateMess('Poor')">🙁 Poor (${state.mess.Poor})</button></div>
  </div>`;
}

function adminView(){
  const pendingPass=state.passes.filter(p=>p.status==='Pending').length, openTix=state.tickets.filter(t=>t.status!=='Resolved').length;
  return `
  <div class="card"><h2>Command Summary</h2>
    <div class="grid4">
      <div class="metric"><b>${pendingPass}</b><span>Pending Passes</span></div>
      <div class="metric"><b>${openTix}</b><span>Open Tickets</span></div>
      <div class="metric"><b>18h</b><span>Avg Resolution</span></div>
      <div class="metric"><b style="color:var(--bad)">${state.tickets.filter(t=>t.age>48).length}</b><span>&gt;48h Aged</span></div>
    </div></div>
  <div class="card alertcard"><h2 style="color:var(--warn)">⚠ Pattern Cluster Alert</h2>
    <p style="font-size:13px;margin:0">6 plumbing complaints in Hostel B Wing 2 within 48h — possible main pipeline failure.</p>
    <button class="ghost" style="margin-top:10px">Escalate to Facilities</button></div>
  <div class="card"><h2>Gate Pass Approval Queue</h2>
    ${state.passes.filter(p=>p.status==='Pending').length?state.passes.filter(p=>p.status==='Pending').map(p=>`
      <div class="item"><div><b>${p.id}</b> · ${p.student}<div class="meta">${p.dest} · ${p.dep}–${p.ret}</div></div>
      <div><button class="primary" style="margin:0 6px 0 0;padding:7px 13px" onclick="approvePass('${p.id}')">Approve</button>
      <button class="danger" onclick="rejectPass('${p.id}')">Reject</button></div></div>`).join(''):'<p class="meta">Queue clear.</p>'}
  </div>
  <div class="card"><h2>Maintenance Dispatch</h2>
    ${state.tickets.map(t=>`<div class="item"><div><b>${t.id} · ${t.cat}</b><div class="meta">${t.loc} · ${t.assignee}</div></div>
    <div style="text-align:right"><span class="pill ${ageTag(t.age)}">${t.age}h</span><br><span class="pill ${statusTag(t.status)}">${t.status}</span></div></div>`).join('')}
  </div>`;
}

function guardView(){
  return `
  <div class="card"><h2>Gate Verification</h2>
    <label>4-digit OTP or scanned QR code</label>
    <div class="row"><input id="otpIn" maxlength="4" placeholder="e.g. 4821"><button class="primary" style="margin:0" onclick="verifyOtp(document.getElementById('otpIn').value)">Verify Pass</button></div>
    <div id="guardResult"></div></div>
  <div class="card"><h2>Gate Exit History</h2>
    ${state.passes.filter(p=>p.status==='Checked Out').map(p=>`<div class="item"><div><b>${p.student}</b><div class="meta">${p.id} · ${p.dest}</div></div><span class="pill ok">Checked Out</span></div>`).join('')||'<p class="meta">No checkouts recorded yet.</p>'}
  </div>`;
}

function offgridView(){
  return `
  <div class="card"><h2>Network Mode</h2>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" style="width:auto" onclick="toggleOffline()">Simulate Offline / 2G Outage</label>
    <p class="meta">Cached PWA footprint: 1.2MB. Queued actions sync automatically when connectivity returns.</p></div>
  <div class="card"><h2>SMS / USSD Console</h2>
    <div class="term" id="smsLog"><div class="termline">Feature-phone terminal ready. Try: GATE LEAVE 2026-10-02 2026-10-04 HOME</div></div>
    <div class="row" style="margin-top:10px"><input id="smsIn" placeholder="Type SMS command" onkeydown="if(event.key==='Enter')runSms()">
    <button class="primary" style="margin:0" onclick="runSms()">Send</button></div>
    <small class="hint">Also supports: STATUS &lt;pass id&gt;</small></div>
  <div class="card"><h2>Legacy ERP Migration</h2>
    <p class="meta" style="margin:0 0 10px">Bulk-import student rosters from a legacy CSV export.</p>
    <button class="ghost" onclick="importCsv()">Simulate CSV Roster Import</button></div>`;
}

function render(){
  const roles=[['student','Student Space'],['admin','Warden Command'],['guard','Gate Checkpoint'],['offgrid','Off-Grid Engine']];
  document.getElementById('nav').innerHTML=roles.map(([k,l])=>`<button class="${state.role===k?'active':''}" onclick="setRole('${k}')">${l}</button>`).join('');
  const m=document.getElementById('main');
  m.innerHTML = state.role==='student'?studentView():state.role==='admin'?adminView():state.role==='guard'?guardView():offgridView();
}
render();
</script>
</body>
</html>
