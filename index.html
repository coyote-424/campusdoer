<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campus Doer · University Operations</title>
<style>:root{--bg:#07080B;--card:#12151E;--inner:#171B25;--line:#1E2433;--divider:#1E2330;--text:#F3F4F6;--muted:#8F97A6;--terra:#C2410C;--green:#10B981;--amber:#F59E0B;--red:#EF4444}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif}body{min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:#07080B;border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:20}.head{max-width:1500px;margin:auto;padding:18px 38px 15px;display:flex;justify-content:space-between;align-items:center;gap:24px}.brand{display:flex;gap:13px;align-items:center;min-width:250px}.logo{width:30px;height:30px;border:1px solid var(--terra);background:transparent;border-radius:0;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.08em}.title{font-size:14px;font-weight:760;letter-spacing:.01em}.sub{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.02em}.header-actions{display:flex;align-items:center;gap:9px}.status,.sos,.tag{border-radius:999px;padding:6px 9px;font-size:10px;font-weight:700}.status{color:#6EE7B7;background:transparent;border:1px solid #145C46}.sos{color:#FCA5A5;background:transparent;border:1px solid #7F1D1D}
.primary{max-width:1500px;margin:auto;padding:0 38px;display:flex;overflow:auto;gap:24px}.primary button{white-space:nowrap;background:transparent;color:var(--muted);border:0;border-bottom:2px solid transparent;padding:15px 0 13px;font-size:12px;font-weight:650;letter-spacing:.01em}.primary button:hover{color:var(--text)}.primary button.active{color:var(--text);border-color:var(--terra)}
.layout{max-width:1500px;margin:auto;padding:52px 38px 72px;display:grid;grid-template-columns:minmax(260px,30%) minmax(0,70%);gap:72px}.intro{padding:0 0 24px}.eyebrow{color:var(--terra);font-size:10px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;margin-bottom:12px}.intro h1{font-size:28px;line-height:1.12;margin:0 0 10px;letter-spacing:-.02em}.intro p,.meta{color:var(--muted);font-size:12px;line-height:1.6}.subnav{border-top:1px solid var(--divider)}.subnav button{width:100%;background:transparent;color:var(--muted);border:0;border-bottom:1px solid var(--divider);text-align:left;padding:16px 8px 16px 0;font-size:17px;line-height:1.25;font-weight:500;position:relative}.subnav button:hover{color:var(--text)}.subnav button.active{color:var(--text);font-weight:700;padding-left:18px}.subnav button.active:before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;background:var(--terra);transform:translateY(-50%)}.subnav button.active:after{content:""}
.content{min-width:0;max-width:940px}.crumb{border-bottom:1px solid var(--divider);padding:0 0 18px;margin-bottom:30px}.crumb small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em}.crumb h2{margin:7px 0 0;font-size:30px;line-height:1.1;letter-spacing:-.025em}.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:30px;box-shadow:none}.card h3{font-size:17px;margin:0 0 16px}.stack{display:grid;gap:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:18px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.metric{background:var(--card);padding:18px}.metric b{display:block;font-size:20px;margin-top:6px}.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.divider{height:1px;background:var(--divider);margin:22px 0}
button.primary,button.ghost,button.utility{border-radius:2px;padding:10px 14px;font-size:11.5px;font-weight:700}.primary{background:var(--terra);border:1px solid var(--terra);color:#F3F4F6}.ghost,.utility{background:transparent;border:1px solid var(--line);color:var(--text)}.ghost:hover,.utility:hover{border-color:var(--terra);color:#fff}.notice,.success,.warning,.danger{border-radius:2px;padding:12px 13px;font-size:11.5px;line-height:1.55}.notice{background:var(--inner);border:1px solid var(--line)}.success{background:#102A22;border:1px solid #145C46;color:#86EFAC}.warning{background:#2B2110;border:1px solid #6B4A0B;color:#FCD34D}.danger{background:#321518;border:1px solid #7F1D1D;color:#FCA5A5}.tag{background:var(--inner);border:1px solid var(--line);display:inline-block}.tag.green{background:#102A22;border-color:#145C46;color:#86EFAC}.tag.amber{background:#2B2110;border-color:#6B4A0B;color:#FCD34D}.tag.red{background:#321518;border-color:#7F1D1D;color:#FCA5A5}.tag.guardian{background:#351B12;border-color:var(--terra);color:#FDBA9A}
input,select,textarea{width:100%;background:var(--inner);border:1px solid var(--line);border-radius:2px;color:var(--text);padding:11px 12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--terra)}input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--text);-webkit-box-shadow:0 0 0 1000px var(--inner) inset;box-shadow:0 0 0 1000px var(--inner) inset;caret-color:var(--text)}select option{background:var(--inner);color:var(--text)}textarea{min-height:120px;resize:vertical}label.field{display:grid;gap:6px;color:var(--muted);font-size:11px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}.filters{display:flex;gap:7px;flex-wrap:wrap}.filters button{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 10px;font-size:10.5px}.filters button.active{background:#351B12;border-color:var(--terra)}
table{width:100%;border-collapse:collapse;font-size:11.5px}th,td{text-align:left;padding:11px 6px;border-bottom:1px solid var(--divider);vertical-align:top}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border:0}.timeline{display:grid}.time{color:var(--terra);font-size:11px;font-weight:750}.timeline div{padding:15px 0;border-bottom:1px solid var(--divider)}.timeline div:last-child{border:0}.subject{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--divider)}.bar{height:5px;background:var(--inner);border-radius:0;margin-top:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--terra)}.ring{width:135px;height:135px;border-radius:50%;background:conic-gradient(var(--terra) 0 79.6%,var(--inner) 79.6%);display:grid;place-items:center;position:relative;flex:none}.ring:after{content:"";position:absolute;width:94px;height:94px;border-radius:50%;background:var(--card)}.ring b{position:relative;z-index:1;font-size:24px}.ring-wrap{display:flex;align-items:center;gap:28px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);color:var(--muted);border-radius:2px}.terminal{background:#080A0E;border:1px solid var(--line);border-radius:2px;padding:15px;font:11px/1.7 ui-monospace,monospace;color:#A7F3D0;min-height:170px}.toast{display:none;position:fixed;right:20px;bottom:20px;background:var(--inner);border:1px solid var(--terra);padding:12px;border-radius:2px;font-size:11px;z-index:30}.toast.show{display:block}
@media(max-width:1000px){.head{padding:16px 22px}.primary{padding:0 22px;gap:18px}.layout{grid-template-columns:260px minmax(0,1fr);gap:40px;padding:40px 22px 60px}.subnav button{font-size:15px}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:720px){.layout{grid-template-columns:1fr;padding:28px 18px 48px;gap:30px}.subnav{display:block}.subnav button{font-size:16px}.content{max-width:none}.head{padding:14px 18px}.brand{min-width:0}.header-actions .status{display:none}.primary{padding:0 18px}.form{grid-template-columns:1fr}.full{grid-column:auto}.crumb h2{font-size:25px}.card{padding:22px}.ring-wrap{align-items:flex-start;flex-direction:column}}

/* TIFF editorial menu flow */
body{background:#08090C;color:#F3F4F6}header{position:sticky;top:0;background:#08090C;border-bottom:1px solid #1E222D;z-index:40}.head{max-width:none;padding:20px 44px 16px}.brand{min-width:0}.logo{border-color:#C2410C}.primary{max-width:none;padding:0 44px;gap:30px}.primary button{font-size:13px;padding:16px 0 14px}.primary button.active{border-color:#C2410C;color:#F3F4F6}.layout{display:block;max-width:1180px;margin:0 auto;padding:64px 44px 100px}.layout aside{display:none}.content{max-width:900px;margin:0 auto}.crumb{border:0;padding:0;margin:0 0 30px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.crumb small{display:block}.crumb h2{font-size:38px;margin-top:9px}.menu-back{background:transparent;border:1px solid #1E2433;color:#8F97A6;padding:9px 13px;border-radius:0;font-size:11px;font-weight:700;white-space:nowrap}.menu-back:hover{color:#F3F4F6;border-color:#C2410C}.card{background:#12151E;border:1px solid #1E2433;border-radius:0;padding:34px}.editorial-menu{position:fixed;inset:0;background:#08090C;z-index:100;overflow:auto;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .18s ease,transform .18s ease,visibility .18s}.editorial-menu.open{opacity:1;visibility:visible;transform:translateY(0)}.menu-top{display:flex;align-items:center;justify-content:space-between;padding:24px 44px 20px;border-bottom:1px solid #1E222D;position:sticky;top:0;background:#08090C;z-index:2}.menu-brand{font-size:14px;font-weight:800;letter-spacing:.02em}.menu-brand span{color:#8F97A6;font-weight:500;margin-left:8px}.menu-close{border:0;background:transparent;color:#F3F4F6;font-size:28px;line-height:1;padding:2px 4px}.menu-close:hover{color:#C2410C}.menu-primary{display:flex;gap:28px;align-items:flex-end;padding:0 44px;border-bottom:1px solid #1E222D;overflow:auto}.menu-primary button{background:transparent;border:0;border-bottom:2px solid transparent;color:#8F97A6;padding:18px 0 16px;font-size:13px;font-weight:650;white-space:nowrap}.menu-primary button.active{color:#F3F4F6;border-color:#C2410C}.menu-body{max-width:1120px;margin:0 auto;padding:58px 44px 90px}.menu-title{font-size:38px;line-height:1.05;margin:0;letter-spacing:-.03em}.tiff-menu-container{max-width:440px;width:100%;margin-top:40px;margin-left:0;padding-left:40px}.tiff-menu-item{display:block;width:100%;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.18);color:#E2E8F0;font-size:17px;font-weight:500;letter-spacing:-.01em;text-decoration:none;cursor:pointer;background:transparent;border-top:none;border-left:none;border-right:none;text-align:left;transition:color .15s ease,padding-left .15s ease}.tiff-menu-item:hover{color:#FFFFFF;padding-left:6px}.tiff-menu-item.active{color:#FFFFFF;font-weight:700}.module-shell{max-width:900px;margin:0 auto}.module-shell .crumb{margin-bottom:28px}.module-shell .card{box-shadow:none}.field input:focus,.field select:focus,.field textarea:focus,input:focus,select:focus,textarea:focus{border-color:#C2410C;box-shadow:0 0 0 1px rgba(194,65,12,.18)}input,select,textarea{background:#141822!important;color:#F3F4F6!important;border-color:#1E2433!important}input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-text-fill-color:#F3F4F6;box-shadow:0 0 0 1000px #141822 inset!important;border:1px solid #1E2433!important;caret-color:#F3F4F6}.ghost,.utility{background:#141822}.tag{background:#141822}.toast{z-index:150}@media(max-width:800px){.head{padding:16px 20px}.primary{padding:0 20px;gap:20px}.layout{padding:42px 20px 70px}.menu-top{padding:18px 20px}.menu-primary{padding:0 20px;gap:20px}.menu-body{padding:44px 20px 70px}.menu-title{font-size:32px}.tiff-menu-item{font-size:18px}.crumb h2{font-size:30px}}
</style>
</head>
<body>
<header>
  <div class="head"><div class="brand"><div class="logo">CD</div><div><div class="title">Campus Doer</div><div class="sub">Digital Operations &amp; Campus Services</div></div></div><div class="header-actions"><span class="status">● Operational</span><button class="sos" onclick="medicalSOS()">Medical SOS</button></div></div>
  <nav id="primaryNav" class="primary"></nav>
</header>
<div class="layout"><main id="main" class="content"></main></div>
<div id="editorialMenu" class="editorial-menu" aria-hidden="true"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

const state={
  activeSection:"academics",activeSubTab:"attendance",menuOpen:false,
  totalHostellers:250,onLeave:12,studentsSkippingDinner:14,currentStudentSkippedDinner:false,
  student:{name:"Rohan Das",roll:"230110145",program:"CSE 1st Year",isDayScholar:false,hostel:"Hostel B",room:"214",onCampus:true},
  isParentLoggedIn:false,
  parentPhone:"",parentRoll:"",
  subjects:[
    {n:"Mathematics",att:22,tot:26,credits:4,grade:"Grade O"},
    {n:"Basic Electrical (BE)",att:18,tot:24,credits:4,grade:"Grade E"},
    {n:"Chemistry",att:20,tot:25,credits:4,grade:"Grade A"},
    {n:"Universal Human Values (UHV)",att:19,tot:22,credits:3,grade:"Grade O"},
    {n:"Programming in C & DS",att:21,tot:26,credits:4,grade:"Grade E"},
    {n:"Basic Civil Engineering (BCE)",att:17,tot:24,credits:3,grade:"Grade A"}
  ],
  passes:[
    {id:"GP-1042",student:"Rohan Das",room:"214",purpose:"Family visit",status:"Pending"},
    {id:"GP-1038",student:"Aarav Sharma",room:"A-118",purpose:"Medical appointment",status:"Approved"}
  ],
  tickets:[
    {id:"TKT-2401",category:"Plumbing",title:"Room water pressure",status:"In Progress",age:"2h"},
    {id:"TKT-2398",category:"Electrical",title:"Geyser fault",status:"Logged",age:"5h"},
    {id:"TKT-2387",category:"Others",title:"Fan repair",status:"Resolved",age:"1d"}
  ],
  parentTickets:[
    {id:"G-771",title:"Room water pressure",status:"In Progress"},
    {id:"G-764",title:"Geyser fault",status:"Logged"},
    {id:"G-752",title:"Fan repair",status:"Resolved"}
  ],
  announcements:[
    {category:"Academic",title:"Mid-semester examination form window",date:"30 Sep 2026",body:"Students should complete the examination form before the published deadline."},
    {category:"Hostel",title:"Mess dinner headcount update",date:"30 Sep 2026",body:"Students skipping dinner should opt out by 6:00 PM."},
    {category:"Administrative",title:"Library access timing notice",date:"29 Sep 2026",body:"Updated evening access timing is available at the library help desk."},
    {category:"Emergency",title:"Medical desk contact protocol",date:"28 Sep 2026",body:"Use Medical SOS for urgent campus medical assistance."}
  ],
  bookings:[],
  gateLog:[{pass:"GP-1042",student:"Rohan Das",action:"Check-in",time:"6:05 PM"}],
  lastTransit:{checkout:"—",destination:"Cuttack - Home",departureDate:"—",returnDate:"—",smsReceived:true},
  guardianEscalations:[],
  offlineMode:false,wardenUnlocked:false,announcementFilter:"All"
};

const sections=[
 {id:"academics",label:"Academics & Attendance",desc:"Attendance, grades, credits, and the daily academic schedule.",tabs:[["attendance","Attendance Pulse & BPUT Calculator"],["subjects","Subject Breakdown"],["grades","Grades & CGPA Summary"],["timetable","Today's Timetable"]]},
 {id:"hostel",label:"Hostel & Living",desc:"Gate passes, dining routines, and dinner headcount.",tabs:[["request-pass","Gate Pass / Outing Request"],["pass-history","Pass History & Emergency OTP"],["mess","Mess Routine & Meal Ratings"],["optout","Opt-Out Dinner Headcount"]]},
 {id:"grievances",label:"Campus Grievances & Repairs",desc:"Report campus issues and follow your ticket ledger.",tabs:[["file-grievance","Universal Issue Reporting"],["ticket-ledger","Tracked Grievance Ledger"]]},
 {id:"announcements",label:"Announcements & Facilities",desc:"Official circulars and simple campus resource booking.",tabs:[["circulars","Official Broadcast Feed"],["booking","Seminar Hall & Resource Booking"]]},
 {id:"warden",label:"Warden Command",desc:"Residence headcount, pass approvals, maintenance operations, and guardian escalations.",tabs:[["warden-overview","Headcount Roster & Mess Forecast"],["warden-passes","Pass Approval Queue"],["maintenance","Maintenance Dispatch & SLA Tracking"]]},
 {id:"gate",label:"Gate Checkpoint",desc:"Verify pass codes and maintain the live departure log.",tabs:[["verify","Pass Verification (OTP / QR)"],["departure","Gate Departure Log"]]},
 {id:"offgrid",label:"Off-Grid Resilience",desc:"Essential workflows for weak connectivity and 2G fallback.",tabs:[["network","Network Offline Simulation"],["terminal","SMS / USSD Fallback Terminal"]]},
 {id:"parent",label:"Parent Portal",desc:"Guardian Sentinel for ward status, transit, welfare, academics, and direct escalation.",tabs:[["ward-overview","Ward Real-Time Status"],["transit","Transit & Gate Exit History"],["nutrition","Mess Dining Activity"],["parent-academics","Attendance & BPUT 75% Check"],["ward-issues","Ward Maintenance & Grievances"],["parent-grievance","Direct Guardian Grievance Escalation"]]}
];

function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function section(id){return sections.find(s=>s.id===id)||sections[0]}
function tab(s){return s.tabs.find(t=>t[0]===state.activeSubTab)||s.tabs[0]}
function att(s){return s.tot?Math.round(s.att/s.tot*100):0}
function overall(){let a=0,t=0;state.subjects.forEach(s=>{a+=s.att;t+=s.tot});return t?Math.round(a/t*100):0}
function meals(){return Math.max(0,state.totalHostellers-state.onLeave-state.studentsSkippingDinner)}
function toast(m){const e=document.getElementById("toast");if(!e)return;e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2400)}
function medicalSOS(){if(confirm("Send a Medical SOS request to the campus medical desk?"))toast("Medical SOS sent.")}

function setSection(id){const s=section(id);state.activeSection=s.id;state.activeSubTab=s.tabs[0][0];state.menuOpen=true;render()}
function selectSubTab(id){const s=section(state.activeSection);if(s.tabs.some(t=>t[0]===id)){state.activeSubTab=id;state.menuOpen=false;render()}}
function closeMenu(){state.menuOpen=false;render()}
function renderNav(){const n=document.getElementById("primaryNav"),s=section(state.activeSection);n.innerHTML=sections.map(x=>'<button class="'+(x.id===s.id?"active":"")+'" onclick="setSection(\''+x.id+'\')">'+esc(x.label)+'</button>').join("");renderEditorialMenu()}
function renderEditorialMenu(){const el=document.getElementById("editorialMenu"),s=section(state.activeSection);el.classList.toggle("open",!!state.menuOpen);el.setAttribute("aria-hidden",state.menuOpen?"false":"true");el.innerHTML='<div class="menu-top"><div class="menu-brand">Campus Doer <span>· Digital Operations &amp; Campus Services</span></div><button class="menu-close" aria-label="Close menu" onclick="closeMenu()">✕</button></div><nav class="menu-primary">'+sections.map(x=>'<button class="'+(x.id===s.id?"active":"")+'" onclick="setSection(\''+x.id+'\')">'+esc(x.label)+'</button>').join("")+'</nav><div class="menu-body"><h1 class="menu-title">'+esc(s.label)+'</h1><div class="tiff-menu-container">'+s.tabs.map(t=>'<button class="tiff-menu-item '+(t[0]===state.activeSubTab?"active":"")+'" onclick="selectSubTab(\''+t[0]+'\')">'+esc(t[1])+'</button>').join("")+'</div></div>'}
function head(s,t){return '<div class="crumb"><div><small>'+esc(s.label)+' / '+esc(t[1])+'</small><h2>'+esc(t[1])+'</h2></div><button class="menu-back" onclick="state.menuOpen=true;render()">← Menu</button></div>'}
function card(x){return '<section class="card">'+x+'</section>'}

function toggleSkipDinner(v){v=!!v;if(v&&!state.currentStudentSkippedDinner)state.studentsSkippingDinner++;if(!v&&state.currentStudentSkippedDinner)state.studentsSkippingDinner=Math.max(0,state.studentsSkippingDinner-1);state.currentStudentSkippedDinner=v;render();toast(v?"Dinner opt-out recorded.":"Dinner opt-out cancelled.")}
function submitPass(e){e.preventDefault();const f=document.getElementById("passForm"),d=new FormData(f),id="GP-"+(1050+state.passes.length);state.passes.unshift({id,student:d.get("student")||"Student",room:d.get("room")||"214",purpose:d.get("purpose")||"Personal work",status:"Pending"});f.reset();render();toast(id+" submitted.")}
function submitTicket(e){e.preventDefault();const f=document.getElementById("ticketForm"),d=new FormData(f),id="TKT-"+(2410+state.tickets.length);state.tickets.unshift({id,category:d.get("category")||"Others",title:d.get("title")||"Campus issue",status:"Logged",age:"now"});f.reset();render();toast(id+" logged.")}
function setTicketStatus(i,status){if(state.tickets[i]){state.tickets[i].status=status;render();toast(state.tickets[i].id+" marked "+status+".")}}
function reassignTicket(i){if(state.tickets[i])toast(state.tickets[i].id+" reassigned to campus maintenance.")}
function setFilter(f){state.announcementFilter=f;render()}
function bookResource(r){state.bookings.unshift({resource:r,time:"Requested · pending approval",owner:"Student",status:"Pending"});render();toast(r+" booking requested.")}
function approvePass(i){if(state.passes[i]){state.passes[i].status="Approved";render();toast(state.passes[i].id+" approved.")}}
function rejectPass(i){if(state.passes[i]){state.passes[i].status="Rejected";render();toast(state.passes[i].id+" rejected.")}}
function unlockWarden(e){e.preventDefault();if(document.getElementById("wardenPin").value==="1234"){state.wardenUnlocked=true;render();toast("Warden Command unlocked.")}else toast("Incorrect demo PIN.")}
function lockWarden(){state.wardenUnlocked=false;render()}
function verifyPass(e){e.preventDefault();const v=document.getElementById("passCode").value.trim(),r=document.getElementById("verifyResult");if(v==="1042"||v==="GP-1042"){state.student.onCampus=false;state.lastTransit={checkout:"6:18 PM",destination:"Cuttack - Home",departureDate:"30 Sep 2026",returnDate:"2 Oct 2026",smsReceived:true};if(!state.gateLog.some(x=>x.pass==="GP-1042"&&x.action==="Checkout"))state.gateLog.unshift({pass:"GP-1042",student:"Rohan Das",action:"Checkout",time:"6:18 PM"});r.className="success";r.textContent="Verified · GP-1042 · Rohan Das · Cuttack - Home. Campus status updated to Checked Out."}else if(v==="1038"||v==="GP-1038"){r.className="success";r.textContent="Verified · GP-1038 · Aarav Sharma · A-118."}else{r.className="danger";r.textContent="Pass not verified."}render()}
function gateCheckout(){state.student.onCampus=false;state.lastTransit={checkout:"Just now",destination:"Cuttack - Home",departureDate:"30 Sep 2026",returnDate:"2 Oct 2026",smsReceived:true};state.gateLog.unshift({pass:"GP-1042",student:"Rohan Das",action:"Checkout",time:"Just now"});render();toast("Rohan Das checkout logged.")}
function toggleOffline(){state.offlineMode=!state.offlineMode;render();toast(state.offlineMode?"Offline / 2G simulation enabled.":"Online mode restored.")}
function terminal(e){e.preventDefault();const i=document.getElementById("termIn"),o=document.getElementById("termOut"),c=i.value.trim().toUpperCase();o.textContent=c==="MESS"?"MESS · DINNER FORECAST "+meals()+" MEALS":c==="STATUS"?"STATUS · "+(state.offlineMode?"OFFLINE/2G":"ONLINE"):c==="PASS"?"PASS · OTP 1042":c==="SOS"?"SOS · MEDICAL ALERT QUEUED":c==="HELP"?"COMMANDS · STATUS / MESS / PASS / SOS":"OK · COMMAND QUEUED";i.value=""}

function loginParent(){const pin=document.getElementById("parentPin").value.trim();const roll=document.getElementById("parentRoll").value.trim();const phone=document.getElementById("parentPhone").value.trim();state.parentPhone=phone;state.parentRoll=roll;const err=document.getElementById("parentPinError");if(pin==="0000"||pin==="1234"||pin===""){state.isParentLoggedIn=true;if(err){err.textContent="";err.style.display="none"}toast("Guardian Authenticated — Access Granted");render()}else{if(err){err.textContent="Invalid PIN. Use default PIN: 0000";err.style.display="block"}}}
function loginParent(){const pin=document.getElementById("parentPin").value.trim();const roll=document.getElementById("parentRoll").value.trim();if(pin==="0000"||pin==="1234"||pin===""){state.isParentLoggedIn=true;state.parentRoll=roll;const err=document.getElementById("parentPinError");if(err)err.style.display="none";toast("Guardian Authenticated — Access Granted");render()}else{const err=document.getElementById("parentPinError");if(err){err.textContent="Invalid PIN. Use default PIN: 0000";err.style.display="block"}}}
function parentLogout(){state.isParentLoggedIn=false;render();toast("Parent Portal locked.")}
function submitGuardian(e){e.preventDefault();const f=document.getElementById("guardianForm"),d=new FormData(f),id="G-"+(780+state.guardianEscalations.length);state.guardianEscalations.unshift({id,category:d.get("category"),details:d.get("details"),time:"Just now"});f.reset();render();toast("Guardian grievance "+id+" sent to Warden Command.")}
function parentGuard(){return state.isParentLoggedIn?"" : card('<h3>Confidential Guardian Access</h3><p class="meta">Enter Registered Parent Phone / Ward Roll Number and the 4-digit PIN.</p><div class="stack"><label class="field">Registered Parent Phone<input id="parentPhone" name="phone" value="9876543210" required inputmode="numeric" autocomplete="tel" placeholder="9876543210"></label><label class="field">Ward Roll Number<input id="parentRoll" name="roll" value="230110145" required inputmode="numeric" autocomplete="off"></label><label class="field">4-digit PIN<input id="parentPin" name="pin" value="0000" required maxlength="4" inputmode="numeric" type="password" autocomplete="off" onkeydown="if(event.key===&quot;Enter&quot;){event.preventDefault();loginParent()}"></label><div id="parentPinError" class="danger" style="display:none"></div><div class="notice"><strong>Confidential Guardian Access</strong> — Limited exclusively to the verified guardian of Rohan Das (Roll: 230110145).</div><button class="primary" type="button" onclick="loginParent()">Enter Parent Portal</button></div>')}
function parentWrap(s,t,body){if(!state.isParentLoggedIn)return head(s,t)+parentGuard();return head(s,t)+body}
function parentOverview(){const s=section("parent"),t=["ward-overview","Ward Overview & Status"];if(!state.isParentLoggedIn)return parentWrap(s,t,"");return parentWrap(s,t,card('<div class="row"><h3>Ward Overview & Status</h3><button class="ghost" onclick="parentLogout()">Lock Portal</button></div><div class="metrics"><div class="metric"><span>Student</span><b>Rohan Das</b></div><div class="metric"><span>Program</span><b>CSE 1st Year</b></div><div class="metric"><span>Residence</span><b>Hostel B · Rm 214</b></div><div class="metric"><span>Campus</span><b style="color:'+(state.student.onCampus?"#10B981":"#F59E0B")+'">'+(state.student.onCampus?"● Currently On Campus":"● Checked Out of Campus")+'</b></div></div><div class="divider"></div><div class="'+(state.student.onCampus?"success":"warning")+'"><strong>Campus status:</strong> '+(state.student.onCampus?"Currently On Campus":"Checked Out of Campus")+'</div><div class="divider"></div><h3>Mess Dining Status</h3><p class="meta">'+(state.student.isDayScholar?"Dining tracking is disabled for Day Scholars.":(state.currentStudentSkippedDinner?"Opted Out / Eating Outside":"Eating at Mess"))+'</p>'))}

function parentTransit(){const s=section("parent"),t=["transit","Gate & Campus Transit Log"];return parentWrap(s,t,card('<h3>Gate & Campus Transit Log</h3><div class="metrics"><div class="metric"><span>Last checkout</span><b>'+esc(state.lastTransit.checkout)+'</b></div><div class="metric"><span>Destination</span><b>'+esc(state.lastTransit.destination)+'</b></div><div class="metric"><span>Departure date</span><b>'+esc(state.lastTransit.departureDate)+'</b></div><div class="metric"><span>Scheduled return</span><b>'+esc(state.lastTransit.returnDate)+'</b></div></div><div class="divider"></div><div class="'+(state.lastTransit.smsReceived?"success":"warning")+'">'+(state.lastTransit.smsReceived?"✓ Parent SMS notification received for leave approval.":"SMS notification has not been recorded.")+'</div><div class="divider"></div><table><thead><tr><th>Pass</th><th>Ward</th><th>Action</th><th>Time</th></tr></thead><tbody>'+state.gateLog.map(x=>'<tr><td>'+esc(x.pass)+'</td><td>'+esc(x.student)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.time)+'</td></tr>').join("")+'</tbody></table>'))}

function parentNutrition(){const s=section("parent"),t=["nutrition","Mess & Nutrition Tracking"];if(state.student.isDayScholar)return parentWrap(s,t,card('<h3>Mess & Nutrition Tracking</h3><div class="notice">Dining tracking is disabled for Day Scholars.</div>'));return parentWrap(s,t,card('<h3>Mess & Nutrition Tracking</h3><div class="'+(state.currentStudentSkippedDinner?"warning":"success")+'"><strong>Tonight’s Dinner:</strong> '+(state.currentStudentSkippedDinner?"Opted Out / Eating Outside":"Eating at Mess")+'</div><div class="divider"></div><h4>Recent meal feedback</h4><table><thead><tr><th>Date</th><th>Meal</th><th>Ward rating</th></tr></thead><tbody><tr><td>30 Sep</td><td>Dinner</td><td><span class="tag green">Good</span></td></tr><tr><td>30 Sep</td><td>Lunch</td><td><span class="tag">OK</span></td></tr><tr><td>29 Sep</td><td>Dinner</td><td><span class="tag">OK</span></td></tr></tbody></table>'))}

function parentAcademics(){const s=section("parent"),t=["parent-academics","Academic Attendance & Grades"];return parentWrap(s,t,card('<h3>Academic Attendance & Grades</h3><div class="ring-wrap"><div class="ring"><b>79.6%</b></div><div><div class="success"><strong>Ward is eligible for semester examinations.</strong></div><p class="meta">Statutory BPUT cutoff: 75%. Guardian view is read-only.</p></div></div><div class="divider"></div><div class="metrics"><div class="metric"><span>Attendance</span><b>79.6%</b></div><div class="metric"><span>BPUT cutoff</span><b>75%</b></div><div class="metric"><span>SGPA</span><b>8.40</b></div><div class="metric"><span>CGPA</span><b>8.64</b></div></div><div class="divider"></div><div class="row"><span class="meta">Credit completion</span><strong>22 credits tracked</strong></div>'))}

function parentIssues(){const s=section("parent"),t=["ward-issues","Ward Maintenance & Grievances"];return parentWrap(s,t,card('<h3>Ward Maintenance & Grievances</h3><table><thead><tr><th>Complaint</th><th>Status</th></tr></thead><tbody>'+state.parentTickets.map(x=>'<tr><td>'+esc(x.title)+'</td><td><span class="tag '+(x.status==="Resolved"?"green":x.status==="In Progress"?"amber":"")+'">'+esc(x.status)+'</span></td></tr>').join("")+'</tbody></table>'))}

function parentGrievance(){const s=section("parent"),t=["parent-grievance","Parent Direct Grievance / Escalation"];return parentWrap(s,t,card('<h3>Direct Guardian Channel</h3><p class="meta">Lodge a concern directly with the Chief Warden / Dean. Every submission is tagged as a Guardian Escalation in Warden Command.</p><form id="guardianForm" onsubmit="submitGuardian(event)" class="form"><label class="field full">Category<select name="category"><option>Hostel Living Conditions</option><option>Mess Food Quality</option><option>Academic / Faculty Concerns</option><option>Medical / Health Issue</option><option>Safety &amp; Anti-Ragging</option><option>Others</option></select></label><label class="field full">Details<textarea name="details" required placeholder="Describe your concern and requested follow-up."></textarea></label><div class="full"><button class="primary" type="submit" style="font-size:12px;padding:11px 14px">Submit Guardian Grievance</button></div></form><div class="divider"></div>'+(state.guardianEscalations.length?state.guardianEscalations.map(x=>'<div class="notice"><span class="tag guardian">[Guardian Escalation]</span><strong style="margin-left:7px">'+esc(x.id)+'</strong><div class="meta">'+esc(x.category)+' · '+esc(x.time)+'</div></div>').join(""):"<div class=\"meta\">No guardian escalations submitted in this session.</div>")))}

function academicsTool(){const s=section("academics"),t=tab(s);if(t[0]==="attendance")return head(s,t)+card('<h3>Attendance Pulse &amp; BPUT Calculator</h3><div class="ring-wrap"><div class="ring"><b>79.6%</b></div><div class="stack" style="flex:1"><div class="metrics"><div class="metric"><span>Overall</span><b>79.6%</b></div><div class="metric"><span>BPUT cutoff</span><b>75%</b></div><div class="metric"><span>SGPA</span><b>8.40</b></div><div class="metric"><span>CGPA</span><b>8.64</b></div></div><div class="success"><strong>Above BPUT cutoff.</strong> Current first-year attendance pulse is 79.6%.</div></div></div>');if(t[0]==="subjects")return head(s,t)+card('<h3>Subject Breakdown</h3>'+state.subjects.map(x=>'<div class="subject"><div><strong>'+esc(x.n)+'</strong><div class="meta">'+x.att+' / '+x.tot+' classes · '+x.credits+' credits · '+esc(x.grade)+'</div><div class="bar"><span style="width:'+att(x)+'%"></span></div></div><strong>'+att(x)+'%</strong></div>').join(""));if(t[0]==="grades")return head(s,t)+card('<h3>Grades &amp; CGPA Summary</h3><div class="metrics"><div class="metric"><span>SGPA</span><b>8.40</b></div><div class="metric"><span>CGPA</span><b>8.64</b></div><div class="metric"><span>Credits</span><b>22</b></div><div class="metric"><span>Subjects</span><b>6</b></div></div>');return head(s,t)+card('<h3>Today’s Timetable</h3><div class="timeline"><div><span class="time">8:00 – 10:45 AM</span><br><strong>Chemistry Lab</strong></div><div><span class="time">10:45 – 11:40 AM</span><br><strong>Break / Recess</strong></div><div><span class="time">11:40 AM – 12:35 PM</span><br><strong>Basic Electrical (BE)</strong></div><div><span class="time">12:35 – 1:30 PM</span><br><strong>Programming in C &amp; DS</strong></div><div><span class="time">1:30 – 2:25 PM</span><br><strong>Basic Civil Engineering (BCE)</strong></div></div>')}

function hostelTool(){const s=section("hostel"),t=tab(s);if(t[0]==="request-pass")return head(s,t)+card('<h3>Request Gate Pass</h3><form id="passForm" onsubmit="submitPass(event)" class="form"><label class="field">Student name<input name="student" value="Rohan Das" required></label><label class="field">Room<input name="room" value="214" required></label><label class="field full">Purpose<select name="purpose"><option>Family visit</option><option>Medical appointment</option><option>Personal work</option><option>Academic activity</option></select></label><div class="full"><button class="primary">Submit Gate Pass Request</button></div></form>');if(t[0]==="pass-history")return head(s,t)+card('<h3>My Pass History &amp; OTP</h3><table><thead><tr><th>Pass</th><th>Purpose</th><th>Status</th></tr></thead><tbody>'+state.passes.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.purpose)+'</td><td><span class="tag '+(x.status==="Approved"?"green":x.status==="Rejected"?"red":"amber")+'">'+esc(x.status)+'</span></td></tr>').join("")+'</tbody></table><div class="divider"></div><div class="notice">Demo OTP: <strong>1042</strong> · Gate verification updates Parent Portal campus status.</div>');if(t[0]==="mess")return head(s,t)+card('<h3>Mess Timings &amp; Routine</h3><div class="timeline"><div><span class="time">7:00–8:00 AM</span><br><strong>Breakfast</strong></div><div><span class="time">2:30–3:30 PM</span><br><strong>Lunch</strong></div><div><span class="time">5:00–5:45 PM</span><br><strong>Snacks</strong></div><div><span class="time">8:00–9:30 PM</span><br><strong>Dinner</strong></div></div>');return head(s,t)+card('<h3>Opt-Out Dinner Headcount</h3><div class="success"><strong>Meals to prepare: '+meals()+'</strong> · 250 − 12 on leave − '+state.studentsSkippingDinner+' opted out.</div><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" '+(state.currentStudentSkippedDinner?"checked":"")+' onchange="toggleSkipDinner(this.checked)"> I will NOT be eating dinner today (Opt-out)</label>')}

function grievanceTool(){const s=section("grievances"),t=tab(s);if(t[0]==="file-grievance")return head(s,t)+card('<h3>File a Grievance</h3><form id="ticketForm" onsubmit="submitTicket(event)" class="form"><label class="field">Category<select name="category"><option>Plumbing</option><option>Electrical</option><option>Campus Wi-Fi / Labs</option><option>Classroom Furniture</option><option>Canteen Hygiene</option><option>Ragging / Noise</option><option>Others</option></select></label><label class="field">Issue title<input name="title" required></label><label class="field full">Details<textarea name="details"></textarea></label><label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="anonymous"> Submit as Anonymous Report</label><div class="full"><button class="primary">File Grievance</button></div></form>');return head(s,t)+card('<h3>My Ticket Ledger</h3><table><thead><tr><th>Ticket</th><th>Category</th><th>Issue</th><th>Status</th><th>Action</th></tr></thead><tbody>'+state.tickets.map((x,i)=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.category)+'</td><td>'+esc(x.title)+'</td><td><span class="tag '+(x.status==="Resolved"?"green":x.status==="In Progress"?"amber":"")+'">'+esc(x.status)+'</span></td><td><button class="ghost" onclick="setTicketStatus('+i+',\'Resolved\')">Mark Resolved</button></td></tr>').join("")+'</tbody></table>')}

function announcementTool(){const s=section("announcements"),t=tab(s);if(t[0]==="circulars"){const fs=["All","Academic","Hostel","Administrative","Emergency"],v=state.announcements.filter(x=>state.announcementFilter==="All"||x.category===state.announcementFilter);return head(s,t)+card('<div class="filters">'+fs.map(f=>'<button class="'+(state.announcementFilter===f?"active":"")+'" onclick="setFilter(\''+f+'\')">'+f+'</button>').join("")+'</div>'+(v.length?v.map(x=>'<div class="divider"><span class="tag">'+esc(x.category)+'</span><h4>'+esc(x.title)+'</h4><div class="meta">'+esc(x.body)+'</div></div>').join(""):'<div class="empty">No circulars.</div>'))}return head(s,t)+card('<h3>Seminar Hall / Resource Booking</h3>'+["Seminar Hall","Projector Room","Club Lawn"].map(r=>'<div class="row" style="padding:12px 0;border-bottom:1px solid var(--divider)"><div><strong>'+r+'</strong><div class="meta">Available for student request</div></div><button class="utility" onclick="bookResource(\''+r+'\')">Request Booking</button></div>').join("")+'<div class="divider"></div><table><thead><tr><th>Resource</th><th>Owner</th><th>Status</th></tr></thead><tbody>'+state.bookings.map(x=>'<tr><td>'+esc(x.resource)+'</td><td>'+esc(x.owner)+'</td><td>'+esc(x.status)+'</td></tr>').join("")+'</tbody></table>')}

function wardenTool(){const s=section("warden"),t=tab(s);if(!state.wardenUnlocked)return head(s,t)+card('<h3>Secure Warden Access</h3><p class="meta">Demo PIN: 1234</p><form onsubmit="unlockWarden(event)" class="stack"><input id="wardenPin" type="password" placeholder="Warden PIN"><button class="primary">Unlock</button></form>');if(t[0]==="warden-overview")return head(s,t)+card('<div class="row"><h3>Overview &amp; Headcount Roster</h3><button class="ghost" onclick="lockWarden()">Lock</button></div><div class="metrics"><div class="metric"><span>Total</span><b>250</b></div><div class="metric"><span>On campus</span><b>238</b></div><div class="metric"><span>Checked out</span><b>12</b></div><div class="metric"><span>Dinner</span><b>'+meals()+'</b></div></div><div class="divider"></div>'+state.guardianEscalations.map(x=>'<div class="notice"><span class="tag guardian">[Guardian Escalation]</span> '+esc(x.id)+' · '+esc(x.category)+'</div>').join(""));if(t[0]==="warden-passes")return head(s,t)+card('<h3>Gate Pass Approval Queue</h3><table><thead><tr><th>Pass</th><th>Student</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+state.passes.map((x,i)=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.student)+'</td><td>'+esc(x.status)+'</td><td><button class="ghost" onclick="approvePass('+i+')">Approve</button> <button class="ghost" onclick="rejectPass('+i+')">Reject</button></td></tr>').join("")+'</tbody></table>');return head(s,t)+card('<h3>Maintenance Dispatch &amp; SLA</h3><table><thead><tr><th>Ticket</th><th>Issue</th><th>Status</th><th>Action</th></tr></thead><tbody>'+state.tickets.map((x,i)=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.status)+'</td><td><button class="ghost" onclick="setTicketStatus('+i+',\'Resolved\')">Mark Resolved</button> <button class="ghost" onclick="reassignTicket('+i+')">Reassign</button></td></tr>').join("")+'</tbody></table>')}

function gateTool(){const s=section("gate"),t=tab(s);if(t[0]==="verify")return head(s,t)+card('<h3>Verify Pass Code / OTP</h3><form onsubmit="verifyPass(event)" class="stack" style="max-width:600px"><input id="passCode" placeholder="Try 1042 or GP-1042" required><button class="primary">Verify Pass</button></form><div id="verifyResult" class="notice" style="margin-top:12px">Awaiting verification.</div>');return head(s,t)+card('<h3>Live Departure Log</h3><button class="utility" onclick="gateCheckout()">Log Rohan Das Checkout</button><div class="divider"></div><table><thead><tr><th>Pass</th><th>Student</th><th>Action</th><th>Time</th></tr></thead><tbody>'+state.gateLog.map(x=>'<tr><td>'+esc(x.pass)+'</td><td>'+esc(x.student)+'</td><td>'+esc(x.action)+'</td><td>'+esc(x.time)+'</td></tr>').join("")+'</tbody></table>')}

function offgridTool(){const s=section("offgrid"),t=tab(s);if(t[0]==="network")return head(s,t)+card('<h3>Network Mode (Offline Sim)</h3><div class="'+(state.offlineMode?"warning":"success")+'">'+(state.offlineMode?"Offline / 2G simulation active.":"Online mode active; fallback channels ready.")+'</div><button class="primary" style="margin-top:13px" onclick="toggleOffline()">'+(state.offlineMode?"Restore Online":"Enable Offline / 2G")+'</button>');return head(s,t)+card('<h3>SMS / USSD Terminal</h3><div id="termOut" class="terminal">READY · TYPE HELP FOR COMMANDS</div><form onsubmit="terminal(event)" style="display:flex;gap:7px;margin-top:9px"><input id="termIn" placeholder="STATUS / MESS / PASS / SOS / HELP"><button class="primary">Send</button></form>')}

function parentTool(){const s=section("parent"),t=tab(s);if(!state.isParentLoggedIn)return head(s,t)+parentGuard();switch(t[0]){case"ward-overview":return parentOverview();case"transit":return parentTransit();case"nutrition":return parentNutrition();case"parent-academics":return parentAcademics();case"ward-issues":return parentIssues();case"parent-grievance":return parentGrievance();default:return parentOverview()}}

function renderMain(){const s=section(state.activeSection),t=tab(s);if(s.id==="academics")document.getElementById("main").innerHTML=academicsTool();else if(s.id==="hostel")document.getElementById("main").innerHTML=hostelTool();else if(s.id==="grievances")document.getElementById("main").innerHTML=grievanceTool();else if(s.id==="announcements")document.getElementById("main").innerHTML=announcementTool();else if(s.id==="warden")document.getElementById("main").innerHTML=wardenTool();else if(s.id==="gate")document.getElementById("main").innerHTML=gateTool();else if(s.id==="offgrid")document.getElementById("main").innerHTML=offgridTool();else document.getElementById("main").innerHTML=parentTool()}
function render(){const s=section(state.activeSection);if(!s.tabs.some(t=>t[0]===state.activeSubTab))state.activeSubTab=s.tabs[0][0];renderNav();renderMain();renderEditorialMenu()}
document.addEventListener("DOMContentLoaded",()=>{try{render()}catch(e){console.error(e);document.getElementById("main").innerHTML='<section class="card"><h3>Render error caught</h3><div class="meta">Refresh to retry.</div></section>'}});
</script>
</body>
</html>
